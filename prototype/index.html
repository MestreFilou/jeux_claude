<title>Huit Thermidor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : à gauche le dossier du commissaire (compétences, jauges, musique), à droite la colonne de dialogue qui défile, comme Disco Elysium. Un seul thème sombre, assumé : Paris à la chandelle, été 1794. */
:root {
  color-scheme: dark;
  --bg: #100d0c;
  --panel: #1a1513;
  --line: #352a22;
  --fg: #e2d8c6;
  --muted: #948878;
  --accent: #8fa6cf;      /* bleu de la cocarde, terni */
  --you: #e8c27a;
  --int: #6aa8e0;         /* Intellect */
  --psy: #a58be0;         /* Psyché */
  --phy: #e0736a;         /* Physique */
  --mot: #e0c45a;         /* Motricité */
  --ok: #7fc48b;
  --ko: #e0736a;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-label: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.55;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(232,170,90,.09), transparent 55%); background-attachment: fixed;
}
.app {
  display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 28px;
  max-width: 1100px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* Dossier */
.dossier { display: flex; flex-direction: column; gap: 18px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 760px) { .dossier { position: static; } }
.brand { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--muted); }
.brand b { display: block; font-size: 30px; letter-spacing: .06em; color: var(--fg); line-height: 1.1; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-family: var(--f-label); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.pips { display: flex; gap: 4px; }
.pip { width: 14px; height: 14px; border: 1px solid var(--line); background: transparent; }
.pip.on.h { background: var(--phy); border-color: var(--phy); }
.pip.on.m { background: var(--psy); border-color: var(--psy); }
.skills { display: grid; gap: 14px; }
.attr h3 { margin: 0 0 4px; font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; }
.attr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.attr li { display: flex; justify-content: space-between; font-family: var(--f-label); font-size: 15px; letter-spacing: .04em; }
.attr li span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.music { border-top: 1px solid var(--line); padding-top: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); line-height: 1.5; }
.music strong { color: var(--accent); font-weight: 500; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.ghost { background: none; border: 1px solid var(--line); color: var(--muted); font-family: var(--f-label); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; padding: 6px 10px; }
.ghost:hover, .ghost:focus-visible { color: var(--fg); border-color: var(--muted); }

/* Colonne de dialogue */
.column { min-width: 0; display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
.scene-title { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.log { display: flex; flex-direction: column; gap: 12px; }
.entry { animation: in .35s ease-out both; }
@keyframes in { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .entry { animation: none; } }
.who { font-family: var(--f-label); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; font-size: 16px; margin-right: 6px; }
.tag { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.narr { color: var(--fg); font-style: italic; opacity: .92; }
.you .who { color: var(--you); }
.you { color: #bfb7a3; }
.npc .who { color: var(--fg); }
.radio .who { color: var(--accent); }
.radio .txt { color: var(--accent); }
.int .who { color: var(--int); } .psy .who { color: var(--psy); } .phy .who { color: var(--phy); } .mot .who { color: var(--mot); }
.roll { font-family: var(--f-mono); font-size: 13px; border-left: 2px solid var(--line); padding: 4px 0 4px 10px; color: var(--muted); }
.roll.ok b { color: var(--ok); } .roll.ko b { color: var(--ko); }
.dice { display: inline-flex; gap: 4px; vertical-align: middle; margin: 0 4px; }
.die { width: 20px; height: 20px; border: 1px solid var(--muted); display: inline-grid; place-items: center; font-size: 12px; color: var(--fg); }
.gauge { font-family: var(--f-mono); font-size: 13px; color: var(--ko); }

.choices { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.choice { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: #c9a75d; padding: 6px 4px; font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
.choice:hover, .choice:focus-visible { color: var(--you); background: rgba(232,194,122,.06); outline: none; }
.choice .n { font-family: var(--f-mono); font-size: 14px; color: var(--muted); padding-top: 2px; min-width: 1.6em; }
.choice .chk { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .06em; font-size: 14px; margin-right: 6px; }
.choice .chk.blanc { color: var(--fg); } .choice .chk.rouge { color: var(--ko); }
.choice[disabled] { color: #5d625f; cursor: not-allowed; background: none; }
.choice[disabled] .chk { color: #5d625f; }

.start { display: grid; gap: 12px; }
.start p { margin: 0; max-width: 60ch; }
.archs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.arch { text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 12px; display: grid; gap: 4px; }
.arch:hover, .arch:focus-visible { border-color: var(--accent); outline: none; }
.arch b { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .08em; font-size: 17px; }
.arch span { font-size: 14px; color: var(--muted); line-height: 1.4; }
.end { border: 1px solid var(--line); background: var(--panel); padding: 14px; display: grid; gap: 8px; }
.end b { font-family: var(--f-label); text-transform: uppercase; letter-spacing: .12em; }
.xp { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.xpbar { height: 4px; background: var(--line); }
.xpbar i { display: block; height: 100%; background: var(--you); }
.xp .pts { color: var(--you); }
.plus { background: none; border: 1px solid var(--you); color: var(--you); font-family: var(--f-mono); font-size: 12px; line-height: 1; padding: 2px 6px; margin-left: 8px; }
.plus:hover, .plus:focus-visible { background: var(--you); color: var(--bg); outline: none; }
.attr li .lv { display: inline-flex; align-items: center; }
.kessel .who { color: var(--accent); } .kessel .txt { color: var(--accent); }
.note { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
</style>

<div class="app">
  <aside class="dossier" aria-label="Dossier de l'agent">
    <div class="brand">Comité de surveillance, section des Piques<b id="agentName">Agent sans masque</b></div>
    <div class="meters">
      <span>Santé</span><div class="pips" id="health"></div>
      <span>Moral</span><div class="pips" id="morale"></div>
    </div>
    <div class="skills" id="skills"></div>
    <div class="xp" id="xp"></div>
    <div class="music" id="music">♪ Aucune musique</div>
    <div class="toolbar"><button class="ghost" id="restart" type="button">Recommencer</button></div>
  </aside>

  <main class="column">
    <div class="scene-title" id="sceneTitle"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <ul class="choices" id="choices"></ul>
  </main>
</div>

<script type="text/plain" class="kv">// Scène 01 : le réveil au comité de surveillance
// Paris, section des Piques, 8 thermidor an II (26 juillet 1794), le matin
// où Robespierre prononce son dernier discours à la Convention.
//
// Format texte à accolades. Le même fichier est lu par le prototype
// navigateur et sera importé dans Unreal Engine (converti en JSON).
//
// Clés d'un noeud :
//   "music"   identifiant d'une piste de la bande-son originale
//   "line"    réplique : speaker, text, et optionnellement passive + difficulty
//             (test passif : niveau + 6 >= difficulté), require / unless (drapeaux)
//   "choice"  choix : text, goto, ou check + difficulty + type (blanc / rouge)
//             + success + failure ; require / unless pour l'afficher ou non
//   "set"     drapeau mis à 1 en entrant dans le noeud
//   "health" / "morale"  modifie les jauges en entrant dans le noeud
//   "hub"     noeud où l'on peut fermer le dialogue et explorer le décor (Unreal)
//   "end"     fin de scène (+ "next" pour choisir la scène suivante)

"dialogue"
{
	"id"	"scene01"
	"title"	"Comité de surveillance de la section des Piques, 8 thermidor an II, 6 h"
	"next"	"scene02"
	"start"	"reveil"

	"nodes"
	{
		"reveil"
		{
			"music"	"Musique.Reveil"
			"line"	{ "speaker" "narrateur" "text" "Le plancher sent la cire froide et le vin renversé. Au-dessus de toi, une chandelle achève de se noyer dans sa propre cire." }
			"line"	{ "speaker" "endurance" "passive" "endurance" "difficulty" "6" "text" "Ta bouche a le goût du fer. Tu as dormi tout habillé, la cocarde de travers. Encore." }
			"line"	{ "speaker" "ferveur" "passive" "ferveur" "difficulty" "8" "text" "DEBOUT, CITOYEN. LA PATRIE NE DORT PAS. LA VIGILANCE EST UNE VERTU." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "10" "text" "Tu rêvais d'une charrette. Elle roulait vers l'échafaud, et tous ceux qui étaient à bord portaient ton visage." }
			"choice"	{ "text" "Te relever." "goto" "bureau" }
			"choice"	{ "text" "Te souvenir de ton nom." "check" "volonte" "difficulty" "8" "type" "rouge" "success" "nom_ok" "failure" "nom_rate" }
			"choice"	{ "text" "Rester au sol. Juste une minute." "goto" "sol" }
		}

		"sol"
		{
			"line"	{ "speaker" "narrateur" "text" "Une minute passe. Dehors, rue Saint-Honoré, les premières charrettes de légumes cahotent sur les pavés." }
			"line"	{ "speaker" "volonte" "text" "Si tu restes là, personne ne viendra te relever. Personne ne vient jamais." }
			"morale"	"-1"
			"choice"	{ "text" "Bon. D'accord. Te relever." "goto" "bureau" }
		}

		"nom_ok"
		{
			"set"	"nom"
			"line"	{ "speaker" "volonte" "text" "Tu avais un nom avant d'avoir une fonction. Il commence par un D. Il sent l'encre et la pluie. Garde-le : c'est tout ce qui t'appartient." }
			"choice"	{ "text" "Te relever, avec ce D dans la poche." "goto" "bureau" }
		}

		"nom_rate"
		{
			"line"	{ "speaker" "volonte" "text" "Rien. Un trou blanc, propre, comme si quelqu'un l'avait gratté au canif." }
			"line"	{ "speaker" "ferveur" "text" "UN NOM EST UNE VANITÉ D'ANCIEN RÉGIME. TU ES UN CITOYEN. CELA SUFFIT." }
			"morale"	"-1"
			"choice"	{ "text" "Te relever." "goto" "bureau" }
		}

		"bureau"
		{
			"hub"	"1"
			"line"	{ "speaker" "narrateur" "unless" "vu_bureau" "text" "La salle du comité de surveillance. Une table chargée de registres, un encrier renversé, l'affiche de la loi des suspects clouée au mur. Sur une chaise, les poignets liés par une corde, une femme te regarde. Ton écharpe tricolore n'est plus autour de ta taille." }
			"line"	{ "speaker" "narrateur" "require" "vu_bureau" "text" "La salle. Les registres. La femme sur sa chaise, qui ne te quitte pas des yeux." }
			"line"	{ "speaker" "perception" "passive" "perception" "difficulty" "10" "unless" "vu_bureau" "text" "Du sang séché sur le pommeau du sabre posé sur la table. Pas beaucoup. Assez." }
			"set"	"vu_bureau"
			"choice"	{ "text" "Parler à la femme ligotée." "goto" "marie" }
			"choice"	{ "text" "Chercher ton écharpe et tes papiers." "check" "perception" "difficulty" "10" "type" "blanc" "success" "carte_ok" "failure" "carte_rate" "unless" "carte" }
			"choice"	{ "text" "Fouiller sous la table, là où elle a parlé d'une bouteille." "goto" "carte_ok" "require" "indice_bureau" "unless" "carte" }
			"choice"	{ "text" "Examiner le sabre." "check" "logique" "difficulty" "12" "type" "blanc" "success" "sabre_ok" "failure" "sabre_rate" "unless" "sabre_vu" }
			"choice"	{ "text" "Répondre aux coups frappés à la porte." "goto" "messager" "require" "vu_marie" "unless" "messager_fait" }
			"choice"	{ "text" "Décider de ce que tu fais d'elle." "goto" "decision" "require" "parle_marie" }
		}

		"carte_ok"
		{
			"set"	"carte"
			"set"	"identite"
			"line"	{ "speaker" "narrateur" "text" "Sous la table, à côté d'une bouteille de calvados vide : ton écharpe tricolore, roulée en boule, et ta carte de civisme. « Désiré Lacombe, commissaire du comité de surveillance, section des Piques. » L'encre a bavé sur le cachet." }
			"line"	{ "speaker" "ferveur" "text" "DÉSIRÉ LACOMBE. COMMISSAIRE. VOILÀ CE QUE TU ES. RIEN DE PLUS. RIEN DE MOINS." }
			"choice"	{ "text" "Garder l'écharpe à la main." "goto" "bureau" }
		}

		"carte_rate"
		{
			"line"	{ "speaker" "narrateur" "text" "Tu fouilles les registres, la corbeille, le dessous de la chaise. La pièce tangue." }
			"line"	{ "speaker" "endurance" "text" "Penche-toi encore une fois et tu vomis sur tes souliers." }
			"health"	"-1"
			"choice"	{ "text" "Laisser tomber pour l'instant." "goto" "bureau" }
		}

		"sabre_ok"
		{
			"set"	"sabre_vu"
			"set"	"autre_personne"
			"line"	{ "speaker" "logique" "text" "Elle n'a aucune blessure. Le sang est sur le pommeau, pas sur la lame : quelqu'un a été frappé pour être arrêté, pas pour être tué. Quelqu'un qui est passé ici cette nuit et qui n'y est plus." }
			"choice"	{ "text" "Retenir ça." "goto" "bureau" }
		}

		"sabre_rate"
		{
			"set"	"sabre_vu"
			"line"	{ "speaker" "logique" "text" "Du sang. Un sabre. Une femme ligotée. La conclusion s'impose d'elle-même, et elle te dégoûte." }
			"morale"	"-1"
			"choice"	{ "text" "Reposer le sabre." "goto" "bureau" }
		}

		"marie"
		{
			"set"	"parle_marie"
			"line"	{ "speaker" "marie" "unless" "vu_marie" "text" "Vous êtes réveillé. Bien. Vous allez me détacher, maintenant ?" }
			"line"	{ "speaker" "marie" "require" "vu_marie" "text" "Quoi encore ?" }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "10" "unless" "vu_marie" "text" "Elle a peur de toi. Mais elle a plus peur encore de la porte derrière toi. Elle attend quelqu'un, et ce n'est pas un ami." }
			"set"	"vu_marie"
			"choice"	{ "text" "« Qui êtes-vous ? »" "goto" "marie_qui" "unless" "marie_qui" }
			"choice"	{ "text" "« Qu'est-ce que je vous ai fait ? »" "goto" "marie_quoi" "unless" "marie_quoi" }
			"choice"	{ "text" "Mentir : « Je me souviens de tout. Avouez. »" "check" "rhetorique" "difficulty" "10" "type" "rouge" "success" "marie_mensonge_ok" "failure" "marie_mensonge_rate" }
			"choice"	{ "text" "Abattre ton poing sur la table pour l'impressionner." "check" "poigne" "difficulty" "8" "type" "rouge" "success" "marie_coup_ok" "failure" "marie_coup_rate" }
			"choice"	{ "text" "« Ce sang sur le sabre. À qui est-il ? »" "goto" "marie_sang" "require" "autre_personne" "unless" "marie_sang" }
			"choice"	{ "text" "Revenir au milieu de la pièce." "goto" "bureau" }
		}

		"marie_qui"
		{
			"set"	"marie_qui"
			"set"	"indice_bureau"
			"line"	{ "speaker" "marie" "text" "Marie-Anne Delorme, lingère, rue de la Sourdière. Vous m'avez arrêtée hier soir comme suspecte. Ensuite vous avez bu le calvados que vous aviez saisi chez moi. La bouteille doit encore être sous la table." }
			"line"	{ "speaker" "rhetorique" "passive" "rhetorique" "difficulty" "10" "text" "Elle récite. Une phrase préparée. Le calvados est vrai, mais ce n'est pas toute l'histoire." }
			"choice"	{ "text" "Continuer." "goto" "marie" }
		}

		"marie_quoi"
		{
			"set"	"marie_quoi"
			"line"	{ "speaker" "marie" "text" "Rien. C'est ça le pire. Vous avez parlé toute la nuit. De votre femme. D'avant. Vous avez pleuré, alors vous avez arraché votre écharpe." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "9" "text" "Avant. Il y avait un avant. Un jardin à Meaux, une odeur de pain, et puis ce matin de janvier où la tête du roi est tombée, et où tu as crié avec la foule." }
			"line"	{ "speaker" "poigne" "passive" "poigne" "difficulty" "10" "text" "Pleurer. Devant une suspecte. Tu es la honte du comité." }
			"choice"	{ "text" "Continuer." "goto" "marie" }
		}

		"marie_sang"
		{
			"set"	"marie_sang"
			"line"	{ "speaker" "marie" "text" "Un autre commissaire est venu vers trois heures. Il voulait m'emmener à la Conciergerie avant le jour. Vous avez refusé. Il a insisté." }
			"line"	{ "speaker" "marie" "text" "Vous l'avez frappé avec le pommeau. Il est parti en jurant qu'il reviendrait avec la garde." }
			"line"	{ "speaker" "logique" "text" "Voilà pourquoi elle regarde la porte. Et voilà pourquoi tu as mal à la main droite." }
			"choice"	{ "text" "Continuer." "goto" "marie" }
		}

		"marie_mensonge_ok"
		{
			"set"	"secret_presse"
			"line"	{ "speaker" "narrateur" "text" "Elle pâlit." }
			"line"	{ "speaker" "marie" "text" "Alors vous savez, pour la presse. Je ne fais qu'imprimer. Des feuilles qui demandent la clémence, comme celles de Desmoulins. Ce n'est pas un crime d'avoir pitié." }
			"line"	{ "speaker" "logique" "text" "Des libelles pour l'indulgence. Desmoulins a été guillotiné pour moins que ça, en germinal." }
			"choice"	{ "text" "Continuer." "goto" "marie" }
		}

		"marie_mensonge_rate"
		{
			"line"	{ "speaker" "marie" "text" "Vous ne vous souvenez même pas de votre propre nom. Vous me l'avez demandé trois fois cette nuit." }
			"line"	{ "speaker" "volonte" "text" "Elle a raison, et elle le sait. Ça fait mal." }
			"morale"	"-1"
			"choice"	{ "text" "Encaisser." "goto" "marie" }
		}

		"marie_coup_ok"
		{
			"set"	"brutal"
			"line"	{ "speaker" "narrateur" "text" "Ton poing s'abat sur la table. L'encrier saute. Elle sursaute, et ses yeux se ferment un instant." }
			"line"	{ "speaker" "ferveur" "text" "BIEN. LA TERREUR N'EST AUTRE CHOSE QUE LA JUSTICE PROMPTE, SÉVÈRE, INFLEXIBLE." }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "8" "text" "Tu viens de perdre quelque chose avec elle. Ça ne reviendra pas." }
			"choice"	{ "text" "Continuer." "goto" "marie" }
		}

		"marie_coup_rate"
		{
			"line"	{ "speaker" "narrateur" "text" "Ton poing rate le plat de la table et ton poignet heurte l'angle. Un craquement sec. Marie-Anne ne bouge même pas." }
			"line"	{ "speaker" "endurance" "text" "Ça, tu vas le sentir toute la journée." }
			"health"	"-1"
			"choice"	{ "text" "Serrer les dents." "goto" "marie" }
		}

		"messager"
		{
			"music"	"Musique.Tension"
			"set"	"messager_fait"
			"line"	{ "speaker" "narrateur" "text" "Trois coups secs contre la porte. Une voix à travers le bois :" }
			"line"	{ "speaker" "messager" "text" "Citoyen commissaire ! Le Comité de sûreté générale réclame ton rapport sur la suspecte Delorme. Réponds !" }
			"line"	{ "speaker" "ferveur" "passive" "ferveur" "difficulty" "6" "text" "RÉPONDS. LE SILENCE EST UN AVEU." }
			"choice"	{ "text" "« Ici le commissaire Lacombe. Tout est en ordre. »" "goto" "messager_ok" "require" "identite" }
			"choice"	{ "text" "« Ici le commissaire... euh... »" "goto" "messager_bafouille" "unless" "identite" }
			"choice"	{ "text" "Prendre une voix d'ivrogne : « Le commissaire est sorti. Repasse plus tard. »" "check" "sangfroid" "difficulty" "12" "type" "rouge" "success" "messager_imite_ok" "failure" "messager_imite_rate" }
			"choice"	{ "text" "Ne pas répondre." "goto" "messager_silence" }
		}

		"messager_ok"
		{
			"set"	"transfert"
			"line"	{ "speaker" "messager" "text" "Bien, citoyen. Une charrette viendra la prendre pour la Conciergerie dans une heure." }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "8" "text" "Derrière toi, Marie-Anne vient d'arrêter de respirer." }
			"choice"	{ "text" "Revenir vers la table." "goto" "bureau" }
		}

		"messager_bafouille"
		{
			"set"	"verification"
			"line"	{ "speaker" "messager" "text" "Tu ne sais plus ton nom, commissaire ? Le Comité saura s'en souvenir pour toi. J'envoie la garde." }
			"morale"	"-1"
			"choice"	{ "text" "Écouter ses pas s'éloigner, la main moite." "goto" "bureau" }
		}

		"messager_imite_ok"
		{
			"set"	"temps_gagne"
			"line"	{ "speaker" "messager" "text" "Encore saoul, celui-là... Je repasserai à midi." }
			"line"	{ "speaker" "sangfroid" "text" "Midi. Assez pour disparaître. Ou pour tout réparer." }
			"choice"	{ "text" "Revenir vers la table." "goto" "bureau" }
		}

		"messager_imite_rate"
		{
			"set"	"verification"
			"line"	{ "speaker" "narrateur" "text" "Ta voix déraille au milieu du mot « sorti »." }
			"line"	{ "speaker" "messager" "text" "Lacombe ? C'est toi ? Bon. Le Comité sera informé que son commissaire joue la comédie." }
			"choice"	{ "text" "Revenir vers la table." "goto" "bureau" }
		}

		"messager_silence"
		{
			"line"	{ "speaker" "narrateur" "text" "Les pas s'éloignent dans l'escalier. Le silence qui suit est épais, presque solide." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "8" "text" "Dans ce silence, une voix qui ne vient de nulle part : « Il n'est pas trop tard pour toi. Pas encore. »" }
			"choice"	{ "text" "Faire comme si tu n'avais rien entendu." "goto" "bureau" }
		}

		"decision"
		{
			"line"	{ "speaker" "narrateur" "text" "Le couteau qui coupera sa corde est à ta ceinture. Tu le sais sans chercher." }
			"line"	{ "speaker" "logique" "require" "transfert" "text" "La charrette arrive dans une heure. Ce que tu décides, décide-le vite." }
			"line"	{ "speaker" "logique" "require" "verification" "text" "La garde arrive. Pour elle, et pour toi." }
			"choice"	{ "text" "La détacher." "goto" "fin_liberte" }
			"choice"	{ "text" "La garder pour la charrette." "goto" "fin_transfert" }
			"choice"	{ "text" "« Montrez-moi votre presse. Je veux lire, moi aussi. »" "goto" "fin_resistance" "require" "secret_presse" }
			"choice"	{ "text" "Nouer ton écharpe et redevenir le commissaire Lacombe." "check" "volonte" "difficulty" "14" "type" "rouge" "success" "fin_echarpe_ok" "failure" "fin_echarpe_rate" "require" "carte" }
			"choice"	{ "text" "Pas encore." "goto" "bureau" }
		}

		"fin_liberte"
		{
			"set"	"marie_libre"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "La corde tombe. Marie-Anne frotte ses poignets sans te quitter des yeux." }
			"line"	{ "speaker" "marie" "text" "Vous avez dit cette nuit que vous vouliez redevenir quelqu'un de bien. Je ne pensais pas que vous vous en souviendriez." }
			"line"	{ "speaker" "marie" "require" "brutal" "text" "Mais ne me touchez plus jamais." }
			"line"	{ "speaker" "narrateur" "text" "Elle sort. Rue Saint-Honoré, le jour se lève sur une ville qui compte ses suspects." }
			"end"	"1"
		}

		"fin_transfert"
		{
			"set"	"marie_livree"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "marie" "text" "D'accord. Vous savez ce qu'on fait des gens, à la Conciergerie ? Non. Vous avez oublié ça aussi." }
			"line"	{ "speaker" "ferveur" "text" "LA LOI EST RESPECTÉE. TU AS BIEN AGI, COMMISSAIRE." }
			"line"	{ "speaker" "volonte" "text" "Alors pourquoi tes mains tremblent-elles ?" }
			"morale"	"-1"
			"end"	"1"
		}

		"fin_resistance"
		{
			"set"	"marie_libre"
			"set"	"contact_resistance"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "marie" "text" "Rue de la Sourdière, la cave sous la lingerie. Frappez trois fois, puis deux. Et venez sans votre écharpe." }
			"line"	{ "speaker" "spectres" "text" "Une colombe dessinée au charbon sur une porte. Tu l'as déjà vue. Dans un rêve, ou dans une autre vie." }
			"line"	{ "speaker" "ferveur" "text" "TRAHISON. TRAHISON. TRAHISON." }
			"end"	"1"
		}

		"fin_echarpe_ok"
		{
			"set"	"echarpe_portee"
			"set"	"marie_attachee"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu noues l'écharpe. Le tissu serre ta taille comme une main. Le monde redevient simple : il y a les patriotes, et il y a les suspects." }
			"line"	{ "speaker" "ferveur" "text" "SALUT ET FRATERNITÉ, CITOYEN LACOMBE." }
			"line"	{ "speaker" "volonte" "text" "Toutes les voix se taisent. Tout devient simple. C'est exactement ça qui devrait te faire peur." }
			"end"	"1"
		}

		"fin_echarpe_rate"
		{
			"set"	"marie_attachee"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu ramasses l'écharpe. Tes mains refusent de la nouer." }
			"line"	{ "speaker" "spectres" "text" "Dans la lumière grise, les trois couleurs ressemblent à trois bandes de linge sale. Aucune ne te ressemble." }
			"line"	{ "speaker" "narrateur" "text" "Tu la reposes sur la table. Marie-Anne te regarde comme si elle te voyait pour la première fois." }
			"morale"	"-1"
			"end"	"1"
		}
	}
}
</script>
<script type="text/plain" class="kv">// Scène 02 : la place des Piques
// Même format que la scène 01. Les drapeaux posés dans la scène 01 sont conservés
// (marie_libre, marie_livree, marie_attachee, contact_resistance, echarpe_portee,
// verification, temps_gagne, autre_personne, marie_sang, nom, brutal...).
// La fin « Comité » mène à scene03_comite, les autres à scene03_cave.
// Contexte : ce 8 thermidor, Robespierre parle à la Convention. Il tombera le lendemain.

"dialogue"
{
	"id"	"scene02"
	"title"	"Place des Piques, 8 thermidor an II, 6 h 40"
	"start"	"place"

	"nodes"
	{
		"place"
		{
			"hub"	"1"
			"music"	"Musique.Place"
			"line"	{ "speaker" "narrateur" "unless" "vu_place" "text" "Dehors, l'air sent le crottin et la fumée de bois. Au centre de la place des Piques, là où se dressait le roi de bronze à cheval, il ne reste qu'un socle vide couvert d'affiches. Un crieur public y est grimpé, une feuille à la main. Près de la fontaine, un vieux porteur d'eau remplit ses seaux sans se presser." }
			"line"	{ "speaker" "narrateur" "unless" "vu_place" "require" "verification" "text" "Au coin de la rue, deux gardes nationaux attendent avec un homme en écharpe tricolore. Un bandage lui barre la mâchoire." }
			"line"	{ "speaker" "narrateur" "unless" "vu_place" "unless" "verification" "text" "Adossé à une porte cochère, un homme en écharpe tricolore te regarde arriver. Un bandage lui barre la mâchoire, et il ne cherche pas à le cacher." }
			"line"	{ "speaker" "perception" "passive" "perception" "difficulty" "8" "unless" "vu_place" "text" "Le bandage est récent. Une tache brune a traversé le linge. Ce visage, tu le connais : Brutus Mercier, commissaire comme toi." }
			"line"	{ "speaker" "logique" "passive" "logique" "difficulty" "8" "require" "autre_personne" "unless" "vu_place" "text" "Le sang sur ton pommeau. Le voilà, son propriétaire." }
			"line"	{ "speaker" "ferveur" "passive" "ferveur" "difficulty" "6" "unless" "vu_place" "text" "SALUE TON FRÈRE. L'UNITÉ EST LA FORCE DE LA RÉPUBLIQUE." }
			"line"	{ "speaker" "ferveur" "require" "echarpe_portee" "unless" "vu_place" "text" "L'ÉCHARPE AUTOUR DE TA TAILLE. TOUT EST À SA PLACE. TOI AUSSI." }
			"line"	{ "speaker" "narrateur" "require" "vu_place" "text" "La place. Le crieur sur son socle. Le porteur d'eau. Mercier qui attend." }
			"set"	"vu_place"
			"choice"	{ "text" "Écouter le crieur public." "goto" "crieur" "unless" "crieur_vu" }
			"choice"	{ "text" "T'approcher du porteur d'eau." "goto" "porteur" "unless" "porteur_vu" }
			"choice"	{ "text" "Aller voir Mercier." "goto" "agent" }
		}

		"crieur"
		{
			"set"	"crieur_vu"
			"line"	{ "speaker" "crieur" "text" "Citoyens ! Décret de la Convention ! Sont ennemis du peuple ceux qui cherchent à inspirer le découragement, à dépraver les mœurs, à altérer la pureté et l'énergie des principes révolutionnaires ! Aux conspirateurs, la loi n'accorde point de défenseurs !" }
			"line"	{ "speaker" "crieur" "text" "Et aujourd'hui, à la Convention, l'Incorruptible prend la parole ! On dit qu'il a une liste !" }
			"line"	{ "speaker" "rhetorique" "passive" "rhetorique" "difficulty" "10" "text" "« Altérer l'énergie des principes. » Une phrase si large qu'on peut y faire entrer n'importe qui. Toi compris." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "9" "text" "Derrière le crieur, le socle vide. Tu vois encore le roi de bronze, et les cordes qu'on lui a passées au cou, en août 92, pendant que la foule chantait." }
			"line"	{ "speaker" "ferveur" "text" "LA CONVENTION A RAISON. LA RÉPUBLIQUE A TOUJOURS RAISON." }
			"line"	{ "speaker" "volonte" "require" "nom" "text" "Une liste. Un nom qui commence par un D. Assure-toi qu'il n'y soit pas." }
			"choice"	{ "text" "Détourner les yeux." "goto" "place" }
		}

		"porteur"
		{
			"set"	"porteur_vu"
			"line"	{ "speaker" "narrateur" "text" "Le porteur d'eau pose ses seaux. Sous le bonnet rouge, des yeux trop doux pour un sans-culotte." }
			"line"	{ "speaker" "porteur" "text" "Le petit Lacombe. Tu as grandi, et tu as mal tourné. Tu ne me reconnais pas ? Tu servais ma messe, à Meaux." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "8" "text" "Une odeur d'encens froid. Une voûte de pierre. Il a vu ton avant. Il le porte en lui comme une pierre dans une poche." }
			"choice"	{ "text" "Lui demander qui tu étais." "check" "empathie" "difficulty" "10" "type" "blanc" "success" "porteur_ok" "failure" "porteur_rate" }
			"choice"	{ "text" "Lui demander ses papiers, comme un commissaire doit le faire." "check" "poigne" "difficulty" "8" "type" "rouge" "success" "porteur_ordre_ok" "failure" "porteur_ordre_rate" }
			"choice"	{ "text" "Le laisser à ses seaux." "goto" "place" }
		}

		"porteur_ok"
		{
			"set"	"souvenir_abbe"
			"line"	{ "speaker" "porteur" "text" "Un garçon qui voulait devenir avocat pour défendre les pauvres. Une femme, Hélène, qui chantait faux en étendant le linge. Puis Hélène est morte de la fièvre, et tu as pris l'écharpe pour ne plus rien sentir. Pas pour la République." }
			"line"	{ "speaker" "volonte" "text" "Pour ne plus rien sentir. Les mots restent en travers de ta gorge." }
			"choice"	{ "text" "Le remercier d'un signe de tête." "goto" "place" }
		}

		"porteur_rate"
		{
			"line"	{ "speaker" "porteur" "text" "Ce que tu étais, il faut avoir le courage de l'entendre. Reviens quand tu l'auras." }
			"line"	{ "speaker" "narrateur" "text" "Il reprend ses seaux. La conversation est finie." }
			"morale"	"-1"
			"choice"	{ "text" "Reculer." "goto" "place" }
		}

		"porteur_ordre_ok"
		{
			"line"	{ "speaker" "narrateur" "text" "Il te tend un certificat de civisme. Faux, mais bien imité. Tu le lui rends sans un mot. Il baisse la tête et reprend ses seaux." }
			"line"	{ "speaker" "ferveur" "text" "ORDRE EXÉCUTÉ. LA SURVEILLANCE EST LE DEVOIR DE TOUS." }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "8" "text" "Tu as vu ses mains trembler. Les tiennes tremblent aussi. Elles le cachent mieux, c'est tout." }
			"choice"	{ "text" "T'éloigner." "goto" "place" }
		}

		"porteur_ordre_rate"
		{
			"line"	{ "speaker" "narrateur" "text" "Ta voix sort trop faible. Le vieil homme te regarde, sans colère, avec quelque chose qui ressemble à de la pitié." }
			"morale"	"-1"
			"choice"	{ "text" "T'éloigner, vite." "goto" "place" }
		}

		"agent"
		{
			"music"	"Musique.Tension"
			"line"	{ "speaker" "mercier" "unless" "agent_vu" "text" "Tiens. Lacombe. Tu te souviens de moi, ou il faut que je te rafraîchisse la mémoire ?" }
			"line"	{ "speaker" "mercier" "require" "agent_vu" "text" "Encore toi. Décide-toi, j'ai une journée." }
			"line"	{ "speaker" "mercier" "unless" "agent_vu" "require" "marie_livree" "text" "La Delorme part pour la Conciergerie dans une heure. Tu vois, quand tu veux." }
			"line"	{ "speaker" "mercier" "unless" "agent_vu" "require" "marie_libre" "text" "La Delorme n'est plus au comité. Tu vas m'expliquer ça, ou tu préfères l'expliquer au Comité de sûreté générale ?" }
			"line"	{ "speaker" "mercier" "unless" "agent_vu" "require" "marie_attachee" "text" "Ta suspecte est toujours ficelée là-haut. Je m'en charge, puisque tu n'en es pas capable." }
			"line"	{ "speaker" "sangfroid" "passive" "sangfroid" "difficulty" "10" "unless" "agent_vu" "text" "Sa main droite ne quitte pas la garde de son sabre. Il a peur de toi. Il a raison." }
			"set"	"agent_vu"
			"choice"	{ "text" "« Qu'est-ce qui s'est passé cette nuit ? »" "goto" "agent_nuit" "unless" "agent_nuit" }
			"choice"	{ "text" "« Tu es venu sans ordre à trois heures, Mercier. Ton rapport ne tiendra pas. »" "check" "rhetorique" "difficulty" "10" "type" "rouge" "success" "agent_bluff_ok" "failure" "agent_bluff_rate" "require" "marie_sang" "unless" "agent_allie" }
			"choice"	{ "text" "Mentir : « La Delorme a été transférée par ordre du Comité. »" "check" "sangfroid" "difficulty" "12" "type" "rouge" "success" "agent_ment_ok" "failure" "agent_ment_rate" "require" "marie_libre" "unless" "agent_allie" }
			"choice"	{ "text" "Le frapper encore. Ça a marché la première fois." "check" "poigne" "difficulty" "12" "type" "rouge" "success" "agent_coup_ok" "failure" "agent_coup_rate" }
			"choice"	{ "text" "« Alors laisse-moi passer. »" "goto" "fin_passage" "require" "agent_allie" }
			"choice"	{ "text" "« Je vais au Comité de sûreté générale. Je ferai mon rapport moi-même. »" "goto" "fin_comite" }
			"choice"	{ "text" "Le contourner et filer vers la rue de la Sourdière." "goto" "fin_cave" "require" "contact_resistance" }
			"choice"	{ "text" "Revenir au milieu de la place." "goto" "place" }
		}

		"agent_nuit"
		{
			"set"	"agent_nuit"
			"line"	{ "speaker" "mercier" "text" "Tu m'as fait chercher vers trois heures. Tu disais que la Delorme imprimait des libelles, qu'il fallait l'emmener avant le jour. Quand je suis arrivé, tu as changé d'avis. Et tu m'as frappé." }
			"line"	{ "speaker" "logique" "text" "Toi, tu l'as dénoncée. Puis tu as refusé de la livrer. Entre les deux, quelque chose s'est passé dans cette salle." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "10" "text" "La bouteille. Les larmes. L'écharpe arrachée. C'est là que tu as changé. Ou que tu es revenu." }
			"choice"	{ "text" "Encaisser." "goto" "agent" }
		}

		"agent_bluff_ok"
		{
			"set"	"agent_allie"
			"line"	{ "speaker" "narrateur" "text" "Il passe la langue sur sa lèvre fendue." }
			"line"	{ "speaker" "mercier" "text" "D'accord. On oublie cette nuit, toi et moi. Personne n'a vu personne." }
			"choice"	{ "text" "Continuer." "goto" "agent" }
		}

		"agent_bluff_rate"
		{
			"set"	"suspect"
			"line"	{ "speaker" "mercier" "text" "Mon rapport ? Le tien, tu vas l'écrire avec quelle main ?" }
			"morale"	"-1"
			"choice"	{ "text" "Serrer les poings." "goto" "agent" }
		}

		"agent_ment_ok"
		{
			"set"	"agent_allie"
			"line"	{ "speaker" "mercier" "text" "Par ordre du Comité ? Personne ne m'a prévenu. Encore un ordre qui s'est perdu entre deux bureaux." }
			"line"	{ "speaker" "sangfroid" "text" "Pas un muscle n'a bougé sur ton visage. Tu ne savais pas que tu savais faire ça." }
			"choice"	{ "text" "Continuer." "goto" "agent" }
		}

		"agent_ment_rate"
		{
			"set"	"suspect"
			"line"	{ "speaker" "mercier" "text" "Tu mens aussi mal que tu bois, Lacombe." }
			"morale"	"-1"
			"choice"	{ "text" "Encaisser." "goto" "agent" }
		}

		"agent_coup_ok"
		{
			"line"	{ "speaker" "narrateur" "text" "Ton poing part avant ta décision. Mercier s'effondre contre la porte cochère. Sur la place, personne ne lève les yeux. Le crieur continue de lire." }
			"line"	{ "speaker" "ferveur" "text" "UN PATRIOTE A FRAPPÉ UN PATRIOTE. TU ES SUSPECT À TON TOUR." }
			"choice"	{ "text" "Courir." "goto" "fin_fuite" }
		}

		"agent_coup_rate"
		{
			"set"	"suspect"
			"line"	{ "speaker" "narrateur" "text" "Il esquive. Le plat de son sabre te cueille aux côtes, et le monde devient blanc." }
			"line"	{ "speaker" "endurance" "text" "Debout. Debout avant qu'il frappe une deuxième fois." }
			"health"	"-2"
			"choice"	{ "text" "Te relever en titubant." "goto" "agent" }
		}

		"fin_comite"
		{
			"next"	"scene03_comite"
			"set"	"route_comite"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu prends la rue Saint-Honoré vers les Tuileries, Mercier sur tes talons. Les volets s'ouvrent sur ton passage, puis se referment." }
			"line"	{ "speaker" "narrateur" "require" "suspect" "text" "Sous son bandage, Mercier sourit." }
			"line"	{ "speaker" "narrateur" "require" "marie_livree" "text" "Une charrette vide te croise. Elle va chercher quelqu'un. Tu sais qui." }
			"line"	{ "speaker" "ferveur" "text" "LE COMITÉ VOIT TOUT. LE COMITÉ PARDONNE À CEUX QUI PARLENT." }
			"end"	"1"
		}

		"fin_cave"
		{
			"next"	"scene03_cave"
			"set"	"route_resistance"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu coupes par la ruelle derrière le socle vide. La voix du crieur s'éteint dans ton dos." }
			"line"	{ "speaker" "narrateur" "text" "Rue de la Sourdière. Une cave sous la lingerie. Trois coups, puis deux. Une porte marquée d'une colombe au charbon s'entrouvre." }
			"line"	{ "speaker" "spectres" "text" "De l'autre côté, ça sent l'encre fraîche et le café brûlé. Comme avant." }
			"end"	"1"
		}

		"fin_passage"
		{
			"next"	"scene03_cave"
			"set"	"route_libre"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "mercier" "text" "Va. Et renoue ton écharpe : on te regarde." }
			"line"	{ "speaker" "narrateur" "text" "Tu traverses la place. Personne ne t'arrête. Pour la première fois de la matinée, personne ne sait où tu vas. Toi non plus." }
			"line"	{ "speaker" "spectres" "text" "Demain, c'est le 9 thermidor. Quelque chose dans l'air le sait déjà." }
			"end"	"1"
		}

		"fin_fuite"
		{
			"next"	"scene03_cave"
			"set"	"route_fugitif"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu cours. Derrière toi, quelqu'un crie « Au suspect ! », et la rue entière tourne la tête." }
			"line"	{ "speaker" "endurance" "text" "Tes poumons brûlent. Tu ne tiendras pas longtemps à ce rythme." }
			"line"	{ "speaker" "spectres" "text" "Quelque part, une colombe au charbon t'attend. Il faudra la trouver avant eux." }
			"end"	"1"
		}
	}
}
</script>
<script type="text/plain" class="kv">// Scène 03 (version cave) : la presse clandestine de la rue de la Sourdière
// On y arrive après les fins « cave », « passage » ou « fuite » de la scène 02.
// Historique : la veille du 9 thermidor, Thérésa Cabarrus, emprisonnée, presse
// son amant le député Tallien d'agir contre Robespierre. Tallien a lui-même
// réprimé Bordeaux avec dureté en 1793.

"dialogue"
{
	"id"	"scene03_cave"
	"title"	"Cave de la rue de la Sourdière, 8 thermidor an II, 9 h"
	"start"	"arrivee"
	"next"	"scene04"

	"nodes"
	{
		"arrivee"
		{
			"music"	"Musique.Cave"
			"line"	{ "speaker" "narrateur" "require" "route_resistance" "text" "La porte à la colombe se referme derrière toi. Une odeur d'encre fraîche, de papier humide et de café brûlé. Au fond, une presse à bras grince sous les mains d'un homme en tablier." }
			"line"	{ "speaker" "narrateur" "unless" "route_resistance" "text" "Tu as suivi le porteur d'eau jusqu'à une ruelle, puis une colombe dessinée au charbon sur une porte basse. Tu as frappé au hasard. Quelqu'un a ouvert, par erreur ou par curiosité. Une odeur d'encre fraîche, de papier humide et de café brûlé." }
			"line"	{ "speaker" "narrateur" "require" "route_fugitif" "text" "Ton cœur cogne encore de la course. Dehors, les cris « Au suspect ! » se sont éteints." }
			"line"	{ "speaker" "anselme" "text" "Une écharpe tricolore dans ma cave. On aura tout vu. Tu viens nous arrêter, citoyen, ou tu viens lire ?" }
			"line"	{ "speaker" "perception" "passive" "perception" "difficulty" "8" "text" "Ses mains sont noires jusqu'aux poignets. Près de la presse, une pile de feuilles fraîches, et un pistolet posé sur un tabouret, à portée de main." }
			"choice"	{ "text" "« Je viens lire. »" "goto" "cave" }
			"choice"	{ "text" "Poser la main sur ton sabre : « Personne ne bouge. »" "check" "poigne" "difficulty" "12" "type" "rouge" "success" "menace_ok" "failure" "menace_rate" }
		}

		"menace_ok"
		{
			"set"	"menace_cave"
			"line"	{ "speaker" "narrateur" "text" "Personne ne bouge. L'homme lève lentement ses mains noires." }
			"line"	{ "speaker" "anselme" "text" "Bien. Tu as gagné. Et maintenant, commissaire ? Tu vas porter cinq cents feuilles tout seul jusqu'au Comité ?" }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "8" "text" "Il n'a pas peur pour lui. Il a peur pour quelqu'un qui n'est pas dans cette pièce." }
			"choice"	{ "text" "Lâcher le sabre. « Je voulais savoir si vous étiez prêts. »" "goto" "cave" }
		}

		"menace_rate"
		{
			"set"	"menace_cave"
			"line"	{ "speaker" "narrateur" "text" "Tu n'as pas fini ton geste que le pistolet est déjà dans sa main, chien levé." }
			"line"	{ "speaker" "anselme" "text" "Pas ici. Ici, on pose les sabres." }
			"morale"	"-1"
			"choice"	{ "text" "Poser le sabre sur le tabouret." "goto" "cave" }
		}

		"cave"
		{
			"hub"	"1"
			"line"	{ "speaker" "narrateur" "unless" "vu_cave" "text" "La cave est basse et voûtée. Des cordes tendues d'un mur à l'autre, où sèchent des feuilles imprimées comme du linge. Une lampe à huile. Une échelle vers une trappe." }
			"line"	{ "speaker" "narrateur" "unless" "vu_cave" "require" "marie_libre" "text" "Assise sur une caisse, Marie-Anne Delorme frotte encore ses poignets. Elle t'a vu entrer et n'a rien dit." }
			"line"	{ "speaker" "narrateur" "unless" "vu_cave" "require" "marie_livree" "text" "Sur une caisse, un châle de lingère plié avec soin. Personne ne s'assoit dessus." }
			"line"	{ "speaker" "narrateur" "require" "vu_cave" "text" "La cave. La presse. Les feuilles qui sèchent sur leurs cordes." }
			"set"	"vu_cave"
			"choice"	{ "text" "Lire une des feuilles qui sèchent." "goto" "feuilles" "unless" "feuilles_lues" }
			"choice"	{ "text" "Parler à l'homme en tablier." "goto" "anselme" }
			"choice"	{ "text" "Parler à Marie-Anne." "goto" "marie" "require" "marie_libre" "unless" "marie_parlee" }
			"choice"	{ "text" "Toucher le châle plié." "goto" "chale" "require" "marie_livree" "unless" "chale_vu" }
			"choice"	{ "text" "Décider de ce que tu feras de la lettre." "goto" "decision" "require" "lettre_vue" }
		}

		"feuilles"
		{
			"set"	"feuilles_lues"
			"line"	{ "speaker" "narrateur" "text" "« Citoyens ! La liberté ne se défend pas en coupant toutes les têtes qui pensent. Ouvrez les prisons aux innocents ; la clémence est aussi une vertu républicaine. »" }
			"line"	{ "speaker" "rhetorique" "passive" "rhetorique" "difficulty" "8" "text" "C'est le ton du Vieux Cordelier, la feuille de Desmoulins. Mot pour mot par endroits. Ils impriment un mort." }
			"line"	{ "speaker" "ferveur" "text" "INDULGENTS. MODÉRÉS. LES ENNEMIS DE LA RÉPUBLIQUE PARLENT TOUJOURS DE CLÉMENCE." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "9" "text" "Tu entends une voix jeune, un peu bègue, qui lit ces lignes à voix haute dans un café du Palais-Royal. Il riait. Il a ri jusqu'à la charrette." }
			"choice"	{ "text" "Reposer la feuille." "goto" "cave" }
		}

		"anselme"
		{
			"line"	{ "speaker" "anselme" "unless" "anselme_vu" "text" "Anselme Roux, typographe. Avant, j'imprimais des almanachs et des chansons. Maintenant j'imprime ce qu'on n'a plus le droit de dire." }
			"line"	{ "speaker" "anselme" "require" "anselme_vu" "text" "Encore toi. L'encre sèche pendant que tu réfléchis." }
			"set"	"anselme_vu"
			"choice"	{ "text" "« Qu'est-ce que vous préparez ? »" "goto" "anselme_plan" "unless" "lettre_vue" }
			"choice"	{ "text" "« Pourquoi me faire confiance ? »" "goto" "anselme_confiance" "unless" "anselme_confiance" }
			"choice"	{ "text" "Le sonder : qui vous protège, à la Convention ?" "check" "logique" "difficulty" "10" "type" "blanc" "success" "anselme_protecteur" "failure" "anselme_protecteur_rate" "unless" "protecteur_connu" }
			"choice"	{ "text" "Revenir au milieu de la cave." "goto" "cave" }
		}

		"anselme_plan"
		{
			"set"	"lettre_vue"
			"line"	{ "speaker" "anselme" "text" "Demain, des députés vont se lever contre Robespierre. Ils ont peur, ils hésitent. Il faut que l'un d'eux, Tallien, n'hésite plus." }
			"line"	{ "speaker" "narrateur" "text" "Il sort de son tablier une lettre pliée, cachetée de cire rouge." }
			"line"	{ "speaker" "anselme" "text" "Elle vient de prison. De Thérésa Cabarrus, sa maîtresse. Elle passe au Tribunal dans trois jours. Elle lui écrit qu'elle mourra en sachant qu'elle a aimé un lâche." }
			"line"	{ "speaker" "anselme" "text" "Un commissaire en écharpe entre partout. Même à la Convention. Toi, tu peux la lui remettre en main propre." }
			"line"	{ "speaker" "logique" "text" "Tallien. Représentant en mission à Bordeaux l'an dernier. La guillotine y a travaillé jour et nuit. Tu aiderais un boucher à en abattre un autre." }
			"choice"	{ "text" "Continuer." "goto" "anselme" }
		}

		"anselme_confiance"
		{
			"set"	"anselme_confiance"
			"line"	{ "speaker" "anselme" "require" "marie_libre" "text" "Je ne te fais pas confiance. Elle, oui. Elle dit que tu as coupé sa corde. C'est plus que ce qu'ont fait les autres." }
			"line"	{ "speaker" "anselme" "unless" "marie_libre" "text" "Je ne te fais pas confiance. Mais un commissaire qui frappe à notre porte au lieu de l'enfoncer, c'est déjà une nouvelle." }
			"line"	{ "speaker" "anselme" "require" "menace_cave" "text" "Et tu as quand même sorti ton sabre. Je m'en souviendrai." }
			"choice"	{ "text" "Continuer." "goto" "anselme" }
		}

		"anselme_protecteur"
		{
			"set"	"protecteur_connu"
			"line"	{ "speaker" "logique" "text" "Il a dit « des députés », pas « nous ». Ils ne sont pas les chefs : ils sont le messager. Quelqu'un, en haut, se sert d'une cave de typographes pour faire passer une lettre qu'il n'ose pas porter lui-même." }
			"line"	{ "speaker" "anselme" "text" "...Fouché. Tu es content ? Si tu répètes ce nom, on est tous morts, toi le premier." }
			"line"	{ "speaker" "sangfroid" "passive" "sangfroid" "difficulty" "8" "text" "Garde ce nom au fond de ta poche. Il vaudra cher demain, d'un côté ou de l'autre." }
			"choice"	{ "text" "Continuer." "goto" "anselme" }
		}

		"anselme_protecteur_rate"
		{
			"line"	{ "speaker" "anselme" "text" "Personne ne nous protège. C'est pour ça qu'on imprime dans une cave." }
			"line"	{ "speaker" "logique" "text" "Il ment, ou il ne sait pas. Tu ne sais pas lequel des deux." }
			"choice"	{ "text" "Continuer." "goto" "anselme" }
		}

		"marie"
		{
			"set"	"marie_parlee"
			"line"	{ "speaker" "marie" "text" "Vous êtes venu. Je ne savais pas si je devais l'espérer ou le craindre." }
			"line"	{ "speaker" "marie" "require" "brutal" "text" "Je n'ai pas oublié votre poing sur la table. Mais je n'ai pas oublié la corde non plus." }
			"line"	{ "speaker" "marie" "text" "Cette nuit, vous m'avez parlé d'Hélène. Vous disiez qu'elle chantait faux. Vous disiez que depuis sa mort, vous ne sentiez plus rien, et que l'écharpe aidait." }
			"line"	{ "speaker" "volonte" "require" "souvenir_abbe" "text" "Hélène. Le porteur d'eau a dit le même nom. Deux personnes qui ne se connaissent pas portent le même morceau de toi." }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "9" "text" "Elle ne te demande rien. C'est pour ça que tu as envie de lui donner quelque chose." }
			"choice"	{ "text" "« Je ne sais pas encore de quel côté je suis. »" "goto" "marie_cote" }
			"choice"	{ "text" "« Merci de m'avoir rendu ce nom. »" "goto" "marie_merci" "require" "nom" }
		}

		"marie_cote"
		{
			"line"	{ "speaker" "marie" "text" "Personne ne le sait, à Paris, cet été. Ceux qui disent le savoir sont les plus dangereux." }
			"choice"	{ "text" "Revenir au milieu de la cave." "goto" "cave" }
		}

		"marie_merci"
		{
			"line"	{ "speaker" "marie" "text" "Désiré. Vous l'avez dit vous-même, vers quatre heures. Vous l'avez répété comme un enfant qui apprend à lire." }
			"line"	{ "speaker" "volonte" "text" "Désiré. Quelqu'un l'a dit à voix haute. Ça tient debout, maintenant." }
			"morale"	"1"
			"choice"	{ "text" "Revenir au milieu de la cave." "goto" "cave" }
		}

		"chale"
		{
			"set"	"chale_vu"
			"line"	{ "speaker" "narrateur" "text" "Le châle est encore tiède, comme si on venait de le poser. Il sent le savon noir et l'amidon." }
			"line"	{ "speaker" "anselme" "text" "C'est celui de Marie-Anne. Elle devait venir ce matin. Elle est à la Conciergerie, à l'heure qu'il est. Grâce à un commissaire en écharpe." }
			"line"	{ "speaker" "volonte" "text" "Il sait. Ils savent tous." }
			"morale"	"-1"
			"choice"	{ "text" "Reposer le châle." "goto" "cave" }
		}

		"decision"
		{
			"line"	{ "speaker" "narrateur" "text" "Anselme te tend la lettre. La cire rouge brille sous la lampe." }
			"line"	{ "speaker" "ferveur" "text" "UNE CONSPIRATION CONTRE L'INCORRUPTIBLE. TON DEVOIR EST CLAIR." }
			"line"	{ "speaker" "spectres" "text" "Le roi, Danton, Desmoulins, et toutes les charrettes de cet été. Combien encore, si personne ne se lève ?" }
			"choice"	{ "text" "Prendre la lettre. Tu la porteras à Tallien." "goto" "fin_lettre" }
			"choice"	{ "text" "Prendre la lettre en jurant de la porter, pour la remettre au Comité." "check" "sangfroid" "difficulty" "12" "type" "rouge" "success" "fin_double_ok" "failure" "fin_double_rate" }
			"choice"	{ "text" "Refuser. « Je ne choisirai pas entre deux bouchers. »" "goto" "fin_refus" }
			"choice"	{ "text" "Pas encore." "goto" "cave" }
		}

		"fin_lettre"
		{
			"set"	"porte_lettre"
			"set"	"camp_conjures"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu glisses la lettre sous ton gilet, contre ta peau. Elle est légère. Elle pèse plus que ton sabre." }
			"line"	{ "speaker" "anselme" "text" "Demain midi, la Convention. Tallien sera au premier rang de la Montagne. Ne la donne à personne d'autre." }
			"line"	{ "speaker" "marie" "require" "marie_libre" "text" "Revenez vivant, Désiré." }
			"end"	"1"
		}

		"fin_double_ok"
		{
			"set"	"porte_lettre"
			"set"	"double_jeu"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Tu prends la lettre, tu serres la main d'Anselme, tu regardes Marie-Anne droit dans les yeux. Personne ne voit rien." }
			"line"	{ "speaker" "sangfroid" "text" "Parfait. Ils te croient. Toi, est-ce que tu te crois encore ?" }
			"line"	{ "speaker" "ferveur" "text" "LE COMITÉ SAURA RÉCOMPENSER UN PATRIOTE." }
			"end"	"1"
		}

		"fin_double_rate"
		{
			"set"	"chasse_cave"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Ta voix a hésité une fraction de seconde de trop. Anselme reprend la lettre d'un geste sec." }
			"line"	{ "speaker" "anselme" "text" "Dehors. Et si la garde vient ici avant ce soir, on saura qui l'a envoyée." }
			"morale"	"-1"
			"end"	"1"
		}

		"fin_refus"
		{
			"set"	"neutre"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "anselme" "text" "Alors va voir, demain. Assieds-toi dans les tribunes et regarde l'histoire se faire sans toi." }
			"line"	{ "speaker" "volonte" "text" "Ne rien choisir, c'est encore choisir. Mais au moins, c'est toi qui choisis de ne pas choisir." }
			"end"	"1"
		}
	}
}
</script>
<script type="text/plain" class="kv">// Scène 03 (version Comité) : le Comité de sûreté générale
// On y arrive après la fin « Comité » de la scène 02.
// Historique : le Comité de sûreté générale, qui siège à l'hôtel de Brionne,
// déteste Robespierre. Vadier, l'un de ses membres, s'est moqué de lui en juin
// avec l'affaire Catherine Théot, une illuminée qui voyait en Robespierre un messie.
// La section des Piques est celle où vit Robespierre.

"dialogue"
{
	"id"	"scene03_comite"
	"title"	"Comité de sûreté générale, hôtel de Brionne, 8 thermidor an II, 9 h"
	"start"	"antichambre"
	"next"	"scene04"

	"nodes"
	{
		"antichambre"
		{
			"music"	"Musique.Comite"
			"line"	{ "speaker" "narrateur" "text" "Une antichambre dorée qui a appartenu à un prince. Les dorures sont restées, le prince non. Sur les banquettes, des gens attendent sans parler, un papier serré dans les mains." }
			"line"	{ "speaker" "narrateur" "require" "suspect" "text" "Mercier s'éloigne vers un huissier et lui glisse quelques mots à l'oreille. L'huissier te regarde." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "9" "text" "Sur les banquettes, il y a plus de monde que tu ne crois. Certains n'ont plus de tête et attendent quand même leur tour." }
			"line"	{ "speaker" "narrateur" "text" "Une porte s'ouvre. Un vieil homme maigre, au visage creusé, te fait signe d'entrer d'un doigt." }
			"choice"	{ "text" "Entrer." "goto" "bureau" }
		}

		"bureau"
		{
			"hub"	"1"
			"line"	{ "speaker" "narrateur" "unless" "vu_bureau_csg" "text" "Un grand bureau couvert de dossiers ficelés. Une fenêtre sur les Tuileries. Le vieil homme s'assoit, croise ses mains osseuses et te regarde avec amusement." }
			"line"	{ "speaker" "vadier" "unless" "vu_bureau_csg" "text" "Vadier, du Comité de sûreté générale. Assieds-toi, commissaire Lacombe. Section des Piques, n'est-ce pas ? La section de l'Incorruptible. Quel honneur." }
			"line"	{ "speaker" "perception" "passive" "perception" "difficulty" "10" "unless" "vu_bureau_csg" "text" "Sur le dossier du dessus, une étiquette : « Théot, Catherine, dite la Mère de Dieu ». Il l'a laissé là exprès, pour que tu le voies." }
			"line"	{ "speaker" "vadier" "require" "vu_bureau_csg" "text" "Alors, commissaire ? J'ai tout mon temps. Enfin, jusqu'à demain." }
			"set"	"vu_bureau_csg"
			"choice"	{ "text" "Faire ton rapport sur la suspecte Delorme." "goto" "rapport" "unless" "rapport_fait" }
			"choice"	{ "text" "« Que voulez-vous vraiment, citoyen ? »" "goto" "vadier_veut" "unless" "vadier_veut" }
			"choice"	{ "text" "Regarder les dossiers sur le bureau." "goto" "dossiers" "unless" "dossiers_vus" }
			"choice"	{ "text" "Donner ta réponse à Vadier." "goto" "decision" "require" "vadier_veut" }
		}

		"rapport"
		{
			"set"	"rapport_fait"
			"line"	{ "speaker" "vadier" "require" "marie_livree" "text" "La Delorme ? Elle est déjà à la Conciergerie, on me l'a dit. Une lingère qui imprime. Le Tribunal s'en occupera en dix minutes. Ce n'est pas pour ça que je t'ai fait venir." }
			"line"	{ "speaker" "vadier" "require" "marie_libre" "text" "La Delorme ? Envolée, d'après ton ami Mercier. Tu l'as relâchée. Un commissaire de la section de Robespierre qui relâche des imprimeuses... Comme c'est intéressant." }
			"line"	{ "speaker" "vadier" "require" "marie_attachee" "text" "La Delorme ? Mercier dit qu'il l'a trouvée ficelée dans ta salle, et toi en train de pleurer sur ton écharpe. Tu es un drôle de commissaire." }
			"line"	{ "speaker" "logique" "text" "Il connaît déjà toute l'histoire. Ton rapport ne l'intéresse pas. C'est toi qui l'intéresses." }
			"choice"	{ "text" "Continuer." "goto" "bureau" }
		}

		"vadier_veut"
		{
			"set"	"vadier_veut"
			"line"	{ "speaker" "vadier" "text" "Ce que je veux ? Que la République survive à ses prophètes." }
			"line"	{ "speaker" "vadier" "text" "Demain, Robespierre va parler encore. Il a une liste, tout Paris le sait. Mon nom y est peut-être. Le tien aussi, depuis cette nuit." }
			"line"	{ "speaker" "vadier" "text" "Je te propose ceci : tu signes un rapport. Tu y écris que des hommes de Robespierre t'ont ordonné de relâcher des suspects de ta section, contre de l'argent. Avec ce papier, demain, je fais taire l'Incorruptible." }
			"line"	{ "speaker" "rhetorique" "passive" "rhetorique" "difficulty" "9" "text" "Il dit « je te propose ». Il veut dire « je t'ordonne ». Et derrière les deux, il y a la charrette." }
			"line"	{ "speaker" "ferveur" "text" "CALOMNIE CONTRE L'INCORRUPTIBLE ! REFUSE !" }
			"choice"	{ "text" "Continuer." "goto" "bureau" }
		}

		"dossiers"
		{
			"set"	"dossiers_vus"
			"line"	{ "speaker" "narrateur" "text" "Tu tires vers toi la pile de dossiers. Vadier ne t'en empêche pas." }
			"line"	{ "speaker" "narrateur" "text" "Des noms, des dates, des adresses. Des signatures au bas de dénonciations : voisins, cousins, domestiques. Paris entier se surveille et s'écrit." }
			"choice"	{ "text" "Chercher ton propre nom." "check" "perception" "difficulty" "10" "type" "blanc" "success" "dossiers_nom" "failure" "dossiers_rate" }
			"choice"	{ "text" "Reposer la pile." "goto" "bureau" }
		}

		"dossiers_nom"
		{
			"set"	"dossier_lacombe"
			"line"	{ "speaker" "narrateur" "text" "« Lacombe, Désiré. Ci-devant clerc de procureur à Meaux. Veuf. Boit. Zèle remarquable depuis la mort de son épouse. » Et en bas, d'une autre encre : « À surveiller. »" }
			"line"	{ "speaker" "volonte" "text" "Veuf. Le mot est sec comme une feuille morte. Mais c'est le tien." }
			"line"	{ "speaker" "vadier" "text" "Tu vois ? Nous sommes tous dans un dossier, commissaire. La seule question est de savoir qui tient la plume." }
			"choice"	{ "text" "Reposer la pile." "goto" "bureau" }
		}

		"dossiers_rate"
		{
			"line"	{ "speaker" "narrateur" "text" "Les noms se brouillent. Il y en a trop, et ils se ressemblent tous." }
			"line"	{ "speaker" "endurance" "text" "Le calvados de cette nuit te remonte dans la gorge. Pas maintenant." }
			"health"	"-1"
			"choice"	{ "text" "Reposer la pile." "goto" "bureau" }
		}

		"decision"
		{
			"line"	{ "speaker" "vadier" "text" "Alors ? Une signature, et tu dors tranquille. Pas de signature, et je ne réponds plus de rien." }
			"line"	{ "speaker" "narrateur" "text" "Il pousse vers toi une feuille déjà écrite et une plume trempée." }
			"choice"	{ "text" "Signer le faux rapport." "goto" "fin_signe" }
			"choice"	{ "text" "Lui offrir mieux : la cave de la rue de la Sourdière." "goto" "fin_denonce" "require" "contact_resistance" }
			"choice"	{ "text" "Lui offrir mieux : l'imprimerie clandestine de la Delorme." "goto" "fin_denonce" "require" "secret_presse" "unless" "contact_resistance" }
			"choice"	{ "text" "Refuser, en le retournant contre lui : « Robespierre aimerait lire ce que vous dites de lui. »" "check" "rhetorique" "difficulty" "13" "type" "rouge" "success" "fin_retourne_ok" "failure" "fin_retourne_rate" }
			"choice"	{ "text" "Refuser simplement." "goto" "fin_refus" }
			"choice"	{ "text" "Pas encore." "goto" "bureau" }
		}

		"fin_signe"
		{
			"set"	"faux_rapport"
			"set"	"camp_conjures"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "La plume gratte. Ta signature est plus droite que tu ne l'aurais cru." }
			"line"	{ "speaker" "vadier" "text" "Parfait. Demain, viens à la Convention. Tribune du public, à gauche. Si on te demande de répéter ce que tu as écrit, tu le répéteras." }
			"line"	{ "speaker" "ferveur" "text" "TRAÎTRE. TRAÎTRE. TRAÎTRE." }
			"line"	{ "speaker" "volonte" "text" "Ou survivant. À Paris, cet été, la différence tient dans une signature." }
			"morale"	"-1"
			"end"	"1"
		}

		"fin_denonce"
		{
			"set"	"denonce_cave"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "vadier" "text" "Une imprimerie d'indulgents ? Voilà qui ne m'intéresse pas du tout, aujourd'hui. Mais Robespierre, lui, adorerait. Garde-la pour toi." }
			"line"	{ "speaker" "vadier" "text" "Je t'inscris quand même. Ça peut toujours servir. Demain, Convention, tribune de gauche. Tu regarderas, et tu apprendras." }
			"line"	{ "speaker" "empathie" "require" "marie_libre" "text" "Tu viens de vendre Marie-Anne pour rien. Il n'en voulait même pas." }
			"morale"	"-1"
			"end"	"1"
		}

		"fin_retourne_ok"
		{
			"set"	"tient_vadier"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "Le sourire de Vadier se fige une demi-seconde. Puis il revient, plus mince." }
			"line"	{ "speaker" "vadier" "text" "Bien joué, commissaire. Nous nous tenons l'un l'autre, maintenant. C'est la seule amitié qui dure, à Paris." }
			"line"	{ "speaker" "sangfroid" "text" "Tu sors sans te presser. Dans ton dos, il ne dit rien. C'est le plus beau compliment qu'il pouvait te faire." }
			"end"	"1"
		}

		"fin_retourne_rate"
		{
			"set"	"marque_vadier"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "vadier" "text" "Robespierre ? Il ne lit plus que ses propres discours. Va, commissaire. Tu es noté." }
			"line"	{ "speaker" "narrateur" "text" "L'huissier te raccompagne jusqu'à la rue. Il ne te lâche pas le bras." }
			"morale"	"-1"
			"end"	"1"
		}

		"fin_refus"
		{
			"set"	"marque_vadier"
			"set"	"neutre"
			"music"	"Musique.Fin"
			"line"	{ "speaker" "vadier" "text" "Dommage. Tu me plaisais. Va donc écouter ton Incorruptible demain, et prie pour qu'il gagne." }
			"line"	{ "speaker" "volonte" "text" "Tu n'as rien signé. Ce n'est pas grand-chose. C'est peut-être tout." }
			"end"	"1"
		}
	}
}
</script>
<script type="text/plain" class="kv">// Scène 04 : la Convention, 9 thermidor an II
// Historique (séance du 9 thermidor, salle des Machines aux Tuileries) :
// Saint-Just commence « Je ne suis d'aucune faction ; je les combattrai toutes. »
// Tallien l'interrompt et demande que « le rideau soit entièrement déchiré ».
// Robespierre ne peut pas parler, couvert par « À bas le tyran ! ».
// Garnier de l'Aube lui lance « Le sang de Danton t'étouffe ! ».
// Augustin Robespierre demande à partager le sort de son frère. L'arrestation est votée.

"dialogue"
{
	"id"	"scene04"
	"title"	"La Convention, salle des Machines, 9 thermidor an II, midi"
	"start"	"tribune"
	"next"	"scene05"

	"nodes"
	{
		"tribune"
		{
			"music"	"Musique.Convention"
			"line"	{ "speaker" "narrateur" "text" "La salle est immense, ancien théâtre des rois, tendue de vert. En bas, sept cents députés sur des gradins. En haut, dans les tribunes, le peuple de Paris s'entasse : sans-culottes, tricoteuses, curieux, mouchards." }
			"line"	{ "speaker" "narrateur" "text" "Il fait une chaleur de four. Un orage gronde quelque part au-dessus de la Seine." }
			"line"	{ "speaker" "perception" "passive" "perception" "difficulty" "8" "text" "Tout en haut de la Montagne, un homme pâle, en habit bleu ciel, poudré avec soin, qui ne regarde personne. Robespierre." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "9" "text" "Les gradins sont pleins. Les places vides aussi : Danton, Desmoulins, Vergniaud. Ils sont venus voir." }
			"line"	{ "speaker" "narrateur" "require" "porte_lettre" "text" "La lettre cachetée te brûle la poitrine sous le gilet." }
			"line"	{ "speaker" "narrateur" "require" "faux_rapport" "text" "De l'autre côté de la salle, Vadier t'a vu. Il te fait un petit signe de tête, comme à un vieil ami." }
			"choice"	{ "text" "Regarder autour de toi." "goto" "galerie" }
		}

		"galerie"
		{
			"hub"	"1"
			"line"	{ "speaker" "narrateur" "text" "La séance n'a pas commencé. On parle bas, on s'évente avec des journaux." }
			"choice"	{ "text" "Descendre vers les gradins pour trouver Tallien." "goto" "couloir" "require" "porte_lettre" "unless" "lettre_traitee" }
			"choice"	{ "text" "Écouter les sans-culottes à côté de toi." "goto" "voisins" "unless" "voisins_vus" }
			"choice"	{ "text" "Attendre l'ouverture de la séance." "goto" "seance" }
		}

		"voisins"
		{
			"set"	"voisins_vus"
			"line"	{ "speaker" "sansculotte" "text" "Si on touche à Robespierre, la Commune sonnera le tocsin. Hanriot a des canons. On verra bien qui gouverne." }
			"line"	{ "speaker" "tricoteuse" "text" "Moi je dis qu'il y en a trop, des charrettes. Ma voisine y est passée pour un mot de travers. Une couturière." }
			"line"	{ "speaker" "sansculotte" "text" "Tais-toi donc, citoyenne. Il y a des oreilles partout." }
			"line"	{ "speaker" "empathie" "passive" "empathie" "difficulty" "8" "text" "Ils ont peur tous les deux, chacun d'une chose différente. Le peuple de Paris est fatigué." }
			"choice"	{ "text" "Revenir à ta place." "goto" "galerie" }
		}

		"couloir"
		{
			"line"	{ "speaker" "narrateur" "text" "Un escalier étroit, puis un couloir derrière les gradins. Un huissier en habit noir te barre la route." }
			"line"	{ "speaker" "huissier" "text" "Les tribunes, c'est en haut, citoyen. Ici, c'est la représentation nationale." }
			"choice"	{ "text" "Montrer ton écharpe : « Commissaire de la section des Piques. Affaire du Comité. »" "goto" "couloir_ok" "require" "carte" }
			"choice"	{ "text" "L'impressionner : « Tu veux expliquer au Comité pourquoi tu m'as retardé ? »" "check" "ferveur" "difficulty" "10" "type" "rouge" "success" "couloir_ok" "failure" "couloir_rate" }
			"choice"	{ "text" "Remonter." "goto" "galerie" }
		}

		"couloir_rate"
		{
			"set"	"lettre_traitee"
			"line"	{ "speaker" "huissier" "text" "Le Comité ? Lequel ? Il y en a deux, et ils se détestent. Remonte, citoyen, ou j'appelle la garde." }
			"line"	{ "speaker" "narrateur" "text" "La lettre reste sous ton gilet. Tallien ne la lira pas." }
			"morale"	"-1"
			"choice"	{ "text" "Remonter." "goto" "galerie" }
		}

		"couloir_ok"
		{
			"line"	{ "speaker" "narrateur" "text" "L'huissier s'efface. Au bout du couloir, un homme de trente ans, beau, nerveux, qui triture quelque chose sous sa redingote. Tallien." }
			"line"	{ "speaker" "narrateur" "require" "double_jeu" "text" "Plus loin, près de la porte du Comité de salut public, un secrétaire de Saint-Just range des papiers." }
			"choice"	{ "text" "Remettre la lettre à Tallien." "goto" "lettre_tallien" }
			"choice"	{ "text" "Remettre la lettre au secrétaire de Saint-Just." "goto" "lettre_saintjust" "require" "double_jeu" }
			"choice"	{ "text" "Garder la lettre et remonter." "goto" "lettre_gardee" }
		}

		"lettre_tallien"
		{
			"set"	"lettre_traitee"
			"set"	"lettre_remise"
			"line"	{ "speaker" "narrateur" "text" "Tallien brise le cachet, lit. Son visage se vide de toute couleur, puis se remplit d'autre chose." }
			"line"	{ "speaker" "tallien" "text" "Elle croit que je suis un lâche. Bien. Aujourd'hui, elle verra." }
			"line"	{ "speaker" "narrateur" "text" "Sous sa redingote, tu aperçois l'éclat d'un poignard." }
			"line"	{ "speaker" "logique" "text" "Tu viens de pousser l'Histoire d'un doigt. Elle penchait déjà. Tu ne sauras jamais si ton doigt comptait." }
			"choice"	{ "text" "Remonter dans les tribunes." "goto" "galerie" }
		}

		"lettre_saintjust"
		{
			"set"	"lettre_traitee"
			"set"	"lettre_livree"
			"line"	{ "speaker" "narrateur" "text" "Le secrétaire prend la lettre, la lit, siffle entre ses dents." }
			"line"	{ "speaker" "secretaire" "text" "Une lettre de la Cabarrus à Tallien. Saint-Just va adorer. Ton nom, citoyen ?" }
			"line"	{ "speaker" "ferveur" "text" "LE DEVOIR EST ACCOMPLI. LA VERTU TRIOMPHERA." }
			"line"	{ "speaker" "spectres" "require" "marie_libre" "text" "Quelque part, dans une cave qui sent le café brûlé, Marie-Anne attend que tu reviennes vivant." }
			"choice"	{ "text" "Remonter dans les tribunes." "goto" "galerie" }
		}

		"lettre_gardee"
		{
			"set"	"lettre_traitee"
			"line"	{ "speaker" "volonte" "text" "Ni pour l'un, ni pour l'autre. La lettre reste contre ta peau. Tu la brûleras ce soir, ou tu la garderas toute ta vie." }
			"choice"	{ "text" "Remonter dans les tribunes." "goto" "galerie" }
		}

		"seance"
		{
			"music"	"Musique.Tension"
			"line"	{ "speaker" "narrateur" "text" "Un jeune homme très droit monte à la tribune. Vingt-six ans, une haute cravate, un visage de marbre. Saint-Just." }
			"line"	{ "speaker" "saintjust" "text" "Je ne suis d'aucune faction ; je les combattrai toutes." }
			"line"	{ "speaker" "narrateur" "text" "Il n'a pas fini sa troisième phrase. Tallien bondit." }
			"line"	{ "speaker" "tallien" "text" "Hier, un membre du gouvernement s'en est isolé. Aujourd'hui, un autre fait de même. Je demande que le rideau soit entièrement déchiré !" }
			"line"	{ "speaker" "narrateur" "require" "lettre_remise" "text" "Il brandit le poignard. Les tribunes hurlent. Tu sais quelle lettre tient ce bras levé." }
			"line"	{ "speaker" "narrateur" "require" "lettre_livree" "text" "Il parle vite, très vite. Comme un homme qui sait qu'on a lu son courrier et qu'il n'a plus rien à perdre." }
			"line"	{ "speaker" "narrateur" "text" "Applaudissements. Billaud-Varenne enchaîne. Robespierre se lève, s'avance vers la tribune." }
			"choice"	{ "text" "Regarder Robespierre." "goto" "robespierre" }
		}

		"robespierre"
		{
			"line"	{ "speaker" "robespierre" "text" "Je demande la parole !" }
			"line"	{ "speaker" "assemblee" "text" "À bas le tyran ! À bas le tyran !" }
			"line"	{ "speaker" "narrateur" "text" "Le président agite sa sonnette. Il ne donne pas la parole à Robespierre. Robespierre crie, sa voix se casse." }
			"line"	{ "speaker" "garnier" "text" "Le sang de Danton t'étouffe !" }
			"line"	{ "speaker" "robespierre" "text" "Lâches ! Pourquoi ne l'avez-vous pas défendu ?" }
			"line"	{ "speaker" "spectres" "text" "Dans la tribune d'en face, tu jurerais voir un grand homme au visage grêlé qui sourit sans joie." }
			"line"	{ "speaker" "ferveur" "text" "ILS ASSASSINENT LA VERTU ! CRIE ! DÉFENDS-LE !" }
			"line"	{ "speaker" "narrateur" "text" "Autour de toi, les tribunes hésitent. Quelques voix pour lui. Beaucoup contre. La plupart se taisent et regardent leurs pieds." }
			"choice"	{ "text" "Crier avec la salle : « À bas le tyran ! »" "goto" "cri_tyran" }
			"choice"	{ "text" "Crier : « Vive Robespierre ! Vive la Commune ! »" "check" "volonte" "difficulty" "10" "type" "rouge" "success" "cri_robespierre_ok" "failure" "cri_robespierre_rate" }
			"choice"	{ "text" "Descendre à la barre témoigner, comme Vadier te l'a demandé." "check" "rhetorique" "difficulty" "11" "type" "rouge" "success" "temoin_ok" "failure" "temoin_rate" "require" "faux_rapport" }
			"choice"	{ "text" "Te taire. Regarder." "goto" "silence" }
		}

		"cri_tyran"
		{
			"set"	"crie_tyran"
			"line"	{ "speaker" "narrateur" "text" "Ta voix se perd dans la clameur. Personne ne l'entend. Toi, si." }
			"line"	{ "speaker" "ferveur" "text" "TRAÎTRE..." }
			"line"	{ "speaker" "volonte" "text" "La voix de la Révolution, dans ta tête, vient de baisser d'un ton. Pour la première fois." }
			"choice"	{ "text" "Regarder la suite." "goto" "vote" }
		}

		"cri_robespierre_ok"
		{
			"set"	"crie_robespierre"
			"line"	{ "speaker" "narrateur" "text" "Ta voix porte. Une dizaine d'hommes autour de toi reprennent : « Vive Robespierre ! » Un gendarme lève la tête vers votre tribune et note quelque chose." }
			"line"	{ "speaker" "ferveur" "text" "OUI ! OUI ! LA VERTU N'EST PAS SEULE !" }
			"choice"	{ "text" "Regarder la suite." "goto" "vote" }
		}

		"cri_robespierre_rate"
		{
			"set"	"crie_robespierre"
			"line"	{ "speaker" "narrateur" "text" "Ta voix sort étranglée, à contretemps. Un sans-culotte te pousse du coude : « Ferme-la, tu vas nous faire tous raccourcir. »" }
			"morale"	"-1"
			"choice"	{ "text" "Regarder la suite." "goto" "vote" }
		}

		"temoin_ok"
		{
			"set"	"temoin"
			"line"	{ "speaker" "narrateur" "text" "Tu descends. On te pousse à la barre. Tu répètes ton rapport : l'argent, les suspects relâchés, les hommes de Robespierre. Ta voix ne tremble pas." }
			"line"	{ "speaker" "narrateur" "text" "Vadier hoche la tête. Des députés notent. Tu viens d'ajouter une pierre au tombeau d'un homme vivant." }
			"line"	{ "speaker" "spectres" "text" "Il te regarde. Une seconde. Ses yeux verts derrière les lunettes. Il ne sait pas qui tu es. Il ne le saura jamais." }
			"morale"	"-1"
			"choice"	{ "text" "Remonter, sans regarder personne." "goto" "vote" }
		}

		"temoin_rate"
		{
			"set"	"temoin"
			"line"	{ "speaker" "narrateur" "text" "À la barre, les mots se dérobent. Tu bégaies, tu te contredis. Des rires dans les tribunes. On te renvoie d'un geste." }
			"line"	{ "speaker" "narrateur" "text" "Vadier ne te regarde plus. C'est pire." }
			"morale"	"-1"
			"choice"	{ "text" "Remonter." "goto" "vote" }
		}

		"silence"
		{
			"set"	"silencieux"
			"line"	{ "speaker" "narrateur" "text" "Tu te tais. Tu regardes. Comme les autres." }
			"line"	{ "speaker" "empathie" "text" "Le sans-culotte à côté de toi pleure sans bruit. Tu ne sais pas pour qui." }
			"choice"	{ "text" "Regarder la suite." "goto" "vote" }
		}

		"vote"
		{
			"line"	{ "speaker" "narrateur" "text" "Un député obscur, Louchet, demande le décret d'arrestation. La salle se lève et applaudit." }
			"line"	{ "speaker" "augustin" "text" "Je suis aussi coupable que mon frère. Je partage ses vertus, je veux partager son sort !" }
			"line"	{ "speaker" "narrateur" "text" "Saint-Just, Couthon, Le Bas suivent. Les gendarmes les emmènent. Il est un peu plus de cinq heures. Dehors, l'orage éclate enfin." }
			"line"	{ "speaker" "sansculotte" "text" "La Commune ne laissera pas faire. Ce soir, on sonne le tocsin à l'Hôtel de Ville." }
			"line"	{ "speaker" "logique" "text" "Ce n'est pas fini. Ce soir, Paris choisira : la Convention ou la Commune. Et toi aussi." }
			"choice"	{ "text" "Sortir sous l'orage." "goto" "fin" }
		}

		"fin"
		{
			"music"	"Musique.Fin"
			"line"	{ "speaker" "narrateur" "text" "La pluie lave les marches des Tuileries. Les tambours de la Commune battent déjà quelque part vers l'Hôtel de Ville." }
			"end"	"1"
		}
	}
}
</script>
<script type="text/plain" class="kv">// Scène 05 : la place de Grève, nuit du 9 au 10 thermidor an II (dernière scène)
// Historique : libéré par la Commune, Robespierre se réfugie à l'Hôtel de Ville.
// Sous la pluie, les sectionnaires venus défendre la Commune rentrent chez eux.
// La section des Piques, celle de Robespierre, se range du côté de la Convention.
// Vers deux heures, les troupes de la Convention entrent. Robespierre a la mâchoire
// fracassée par un coup de pistolet. Selon la tradition, il n'avait écrit que « Ro »
// au bas d'un appel à... la section des Piques.
// Le 10 thermidor, il est guillotiné avec 21 autres ; le 11, 71 membres de la Commune suivent.

"dialogue"
{
	"id"	"scene05"
	"title"	"Place de Grève, nuit du 9 au 10 thermidor an II, 1 h"
	"start"	"greve"

	"nodes"
	{
		"greve"
		{
			"music"	"Musique.Greve"
			"line"	{ "speaker" "narrateur" "text" "La pluie tombe à verse sur la place de Grève. Les fenêtres de l'Hôtel de Ville sont toutes éclairées. Devant, les canons de Hanriot, la gueule mouillée, et des artilleurs qui regardent le ciel en se demandant s'ils vont rester." }
			"line"	{ "speaker" "narrateur" "text" "Il y avait des milliers d'hommes ici à dix heures. Il en reste quelques centaines. Les autres sont rentrés se sécher." }
			"line"	{ "speaker" "spectres" "passive" "spectres" "difficulty" "8" "text" "C'est ici, sur cette place, qu'on pendait et qu'on rouait sous les rois. Les pavés s'en souviennent mieux que les hommes." }
			"choice"	{ "text" "Regarder autour de toi." "goto" "place" }
		}

		"place"
		{
			"hub"	"1"
			"line"	{ "speaker" "narrateur" "require" "vu_greve" "text" "La pluie. Les canons. Les fenêtres éclairées de l'Hôtel de Ville." }
			"set"	"vu_greve"
			"choice"	{ "text" "Parler aux hommes de ta section, sous la pluie." "goto" "piquiers" "unless" "piquiers_vus" }
			"choice"	{ "text" "Rejoindre la femme au châle, près des canons." "goto" "marie" "require" "marie_libre" "unless" "marie_greve" }
			"choice"	{ "text" "Monter à l'Hôtel de Ville." "goto" "escalier" }
			"choice"	{ "text" "Courir à la Conciergerie, où est Marie-Anne." "goto" "conciergerie" "require" "marie_livree" }
		}

		"piquiers"
		{
			"set"	"piquiers_vus"
			"line"	{ "speaker" "piquier" "text" "Commissaire Lacombe ! La section des Piques a voté il y a une heure : nous sommes pour la Convention. Pour la Convention, tu entends ? Sa propre section." }
			"line"	{ "speaker" "piquier" "text" "On vient chercher Hanriot et les autres. Tu marches avec nous ?" }
			"line"	{ "speaker" "ferveur" "text" "SA PROPRE SECTION. LES INGRATS. LES LÂCHES." }

		"marie"
		{
			"set"	"marie_greve"
			"line"	{ "speaker" "narrateur" "text" "Marie-Anne, trempée, un paquet de feuilles serré sous son châle pour les garder au sec." }
			"line"	{ "speaker" "marie" "text" "Je voulais voir ça. La fin, ou le début, je ne sais pas encore." }
			"line"	{ "speaker" "marie" "require" "lettre_remise" "text" "Anselme dit que Tallien a sorti son poignard à la tribune. Il dit que c'est grâce à un commissaire." }
			"line"	{ "speaker" "marie" "require" "lettre_livree" "text" "Anselme dit qu'on a lu le courrier de Tallien chez Saint-Just. Il cherche qui l'a porté. Il n'a pas encore trouvé." }

		{
			"line"	{ "speaker" "narrateur" "text" "Tu cours le long des quais sous la pluie. La Conciergerie est une masse noire au bord de l'eau. Un guichetier mal réveillé entrouvre le judas." }

		"conciergerie_rate"
		{
			"line"	{ "speaker" "guichetier" "text" "Pas d'ordre, pas de prisonnière. Reviens demain. Demain, ce sera peut-être un autre monde." }
			"line"	{ "speaker" "volonte" "text" "Demain. Elle passera au Tribunal, ou les prisons s'ouvriront. Tu ne peux plus rien cette nuit." }
			"morale"	"-1"
			"choice"	{ "text" "Revenir à la place de Grève." "goto" "place" }
		}

		"escalier"
		{
			"music"	"Musique.Tension"
			"line"	{ "speaker" "narrateur" "text" "Le grand escalier est plein de boue et de cocardes piétinées. Personne ne t'arrête : ton écharpe, ou ton air, suffit. Au premier étage, une salle, des chandelles, des hommes épuisés autour d'une table." }
			"line"	{ "speaker" "narrateur" "text" "Robespierre est assis, une plume à la main, devant une feuille à en-tête de la Commune. Il lève les yeux. Il voit ton écharpe." }
			"line"	{ "speaker" "robespierre" "text" "Vous êtes de quelle section, citoyen ?" }
			"choice"	{ "text" "« Des Piques. »" "goto" "appel" }
