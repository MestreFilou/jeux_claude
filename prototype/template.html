.plus:hover, .plus:focus-visible { background: var(--you); color: var(--bg); outline: none; }

<script>
// ---------- Lecteur KeyValues ----------
function parseKV(src) {
  const toks = []; let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '/' && src[i + 1] === '/') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (c === '{' || c === '}') { toks.push(c); i++; continue; }
    if (c === '"') {
      let s = ''; i++;
      while (i < src.length && src[i] !== '"') { if (src[i] === '\\' && i + 1 < src.length) { i++; s += src[i] === 'n' ? '\n' : src[i]; } else s += src[i]; i++; }
      i++; toks.push({ s }); continue;
    }
    let s = ''; while (i < src.length && !/[\s{}"]/.test(src[i])) s += src[i++]; toks.push({ s });
  }
  let p = 0;
  function block() {
    const out = [];
    while (p < toks.length && toks[p] !== '}') {
      const k = toks[p++].s; const v = toks[p];
      if (v === '{') { p++; out.push([k, block()]); p++; } else { p++; out.push([k, v.s]); }
    }
    return out;
  }
  return block();
}
const get = (pairs, k) => { const f = pairs.find(x => x[0] === k); return f ? f[1] : undefined; };
const getAll = (pairs, k) => pairs.filter(x => x[0] === k).map(x => x[1]);

// Toutes les scènes, dans l'ordre des fichiers
const SCENES = {}; const ORDER = [];
document.querySelectorAll('script.kv').forEach(el => {
  const d = get(parseKV(el.textContent), 'dialogue');
  const id = get(d, 'id');
  SCENES[id] = { id, title: get(d, 'title'), start: get(d, 'start'), next: get(d, 'next'), nodes: Object.fromEntries(get(d, 'nodes')) };
  ORDER.push(id);
});

// ---------- Compétences et règles ----------
const ATTRS = [
  { id: 'int', name: 'Intellect', skills: [['logique', 'Logique'], ['rhetorique', 'Rhétorique']] },
  { id: 'psy', name: 'Psyché', skills: [['empathie', 'Empathie'], ['volonte', 'Volonté'], ['ferveur', 'Ferveur'], ['spectres', 'Spectres']] },
  { id: 'phy', name: 'Physique', skills: [['endurance', 'Endurance'], ['poigne', 'Poigne']] },
  { id: 'mot', name: 'Motricité', skills: [['perception', 'Perception'], ['sangfroid', 'Sang-froid']] },
];
const SKILL = {}; ATTRS.forEach(a => a.skills.forEach(([id, name]) => SKILL[id] = { name, attr: a.id }));
const ARCHETYPES = [
  { name: 'Le Zélé', desc: 'Patriote sans états d\'âme, la poigne facile. La voix de la Révolution parle fort dans sa tête.',
    s: { ferveur: 4, poigne: 4, endurance: 3, volonte: 3, sangfroid: 2, perception: 2, logique: 1, rhetorique: 1, empathie: 1, spectres: 1 } },
  { name: "L'Avocat", desc: 'Formé au barreau avant 89. Observe, déduit, ment avec aplomb. Le corps suit mal.',
    s: { logique: 4, rhetorique: 4, perception: 3, sangfroid: 3, ferveur: 2, volonte: 2, empathie: 2, spectres: 1, endurance: 1, poigne: 1 } },
  { name: 'Le Hanté', desc: 'Sent tout, voit les morts de la place. Fragile.',
    s: { empathie: 4, spectres: 4, volonte: 3, perception: 2, rhetorique: 2, logique: 2, endurance: 2, sangfroid: 1, poigne: 1, ferveur: 1 } },
];
const MUSIC = {
  'Musique.Reveil': 'violoncelle seul et nappe grave, presque immobile',
  'Musique.Place': 'tambour lent, cordes frottées, « Ça ira » déformé au loin',
  'Musique.Tension': 'percussions sèches et cordes en trémolo',
  'Musique.Fin': 'accord suspendu, conclusion ouverte',
  'Musique.Cave': 'presse qui grince, contrebasse sourde',
  'Musique.Comite': 'clavecin désaccordé, horloge',
  'Musique.Convention': 'rumeur de foule, orage lointain, cuivres graves',
  'Musique.Greve': "pluie, tocsin, tambours qui s'éloignent",
};
const SPEAKERS = {
  marie: ['Marie-Anne Delorme', 'npc'], messager: ['Estafette du Comité', 'radio'], crieur: ['Crieur public', 'kessel'],
  porteur: ["Le porteur d'eau", 'npc'], mercier: ['Brutus Mercier', 'npc'],
  anselme: ['Anselme Roux', 'npc'],
  vadier: ['Vadier', 'npc'],
  sansculotte: ['Un sans-culotte', 'npc'],
  tricoteuse: ['Une tricoteuse', 'npc'],
  huissier: ["L'huissier", 'radio'],
  tallien: ['Tallien', 'npc'],
  secretaire: ['Le secrétaire', 'npc'],
  saintjust: ['Saint-Just', 'radio'],
  robespierre: ['Robespierre', 'npc'],
  assemblee: ["L'Assemblée", 'radio'],
  garnier: ["Garnier de l'Aube", 'npc'],
  augustin: ['Augustin Robespierre', 'npc'],
  piquier: ['Un homme des Piques', 'npc'],
  guichetier: ['Le guichetier', 'radio'],
};
const XP_PER_POINT = 3;
const diffName = d => d <= 6 ? 'Trivial' : d <= 8 ? 'Facile' : d <= 10 ? 'Moyen' : d <= 12 ? 'Difficile' : d <= 14 ? 'Redoutable' : 'Héroïque';
function chance(level, diff) {
  let ok = 0;
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) {
    if (a === 6 && b === 6) ok++; else if (a === 1 && b === 1) {} else if (a + b + level >= diff) ok++;
  }
  return Math.round(ok / 36 * 100);
}

// ---------- État ----------
let S;
const $ = id => document.getElementById(id);
function newGame(arch) {
  S = { arch, skills: { ...arch.s }, flags: new Set(), tried: new Set(), failedWhite: new Map(), over: false, xp: 0, points: 0, scene: null, node: null };
  S.maxH = S.skills.endurance + 2; S.maxM = S.skills.volonte + 2; S.health = S.maxH; S.morale = S.maxM;
  $('agentName').textContent = arch.name;
  startScene(ORDER[0]);
}
function startScene(id) {
  // Répit entre deux scènes : +1 santé, +1 moral.
  if (S.scene && S.scene.id !== id) { S.health = Math.min(S.maxH, S.health + 1); S.morale = Math.min(S.maxM, S.morale + 1); }
  S.scene = SCENES[id];
  $('log').innerHTML = '';
  const num = (id.match(/scene0*(\d+)/) || [])[1] || (ORDER.indexOf(id) + 1);
  $('sceneTitle').textContent = `Scène ${num} · ${S.scene.title}`;
  renderDossier(); enter(S.scene.start);
}
const passes = pairs => getAll(pairs, 'require').every(f => S.flags.has(f)) && !getAll(pairs, 'unless').some(f => S.flags.has(f));

function add(html, cls) {
  const d = document.createElement('div'); d.className = 'entry ' + (cls || ''); d.innerHTML = html; $('log').appendChild(d);
  d.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function say(line) {
  const who = get(line, 'speaker'), text = esc(get(line, 'text'));
  const passive = get(line, 'passive');
  if (passive && S.skills[passive] + 6 < +get(line, 'difficulty')) return;
  if (who === 'narrateur') return add(`<span class="narr">${text}</span>`);
  const sk = SKILL[who];
  if (sk) {
    const tag = passive ? `<span class="tag">[${diffName(+get(line, 'difficulty'))} : réussite]</span>` : '';
    return add(`<span class="who">${sk.name}</span>${tag}${text}`, sk.attr);
  }
  const [name, cls] = SPEAKERS[who] || [who, 'npc'];
  add(`<span class="who">${esc(name)}</span><span class="txt">${text}</span>`, cls);
}

function gainXP(n, why) {
  S.xp += n;
  while (S.xp >= XP_PER_POINT) { S.xp -= XP_PER_POINT; S.points++; add(`<span class="gauge" style="color:var(--you)">+1 point de compétence. Dépense-le dans le dossier.</span>`); }
  renderDossier();
}

function gauge(kind, delta) {
  S[kind] = Math.max(0, Math.min(kind === 'health' ? S.maxH : S.maxM, S[kind] + delta));
  add(`<span class="gauge">${kind === 'health' ? 'Santé' : 'Moral'} ${delta > 0 ? '+' : ''}${delta}</span>`);
  renderDossier();
  if (S[kind] <= 0) {
    S.over = true;
    add(kind === 'health' ? `<span class="narr">Ton corps lâche. Le pavé revient contre ta joue, et cette fois il y reste.</span>`
                          : `<span class="narr">Quelque chose en toi s'éteint. Tu noues l'écharpe sans réfléchir, et tu n'entends plus rien.</span>`);
    endPanel('Fin de partie', null);
  }
}

function enter(id) {
  const node = S.scene.nodes[id];
  if (!node) { add(`<span class="note">Noeud introuvable : ${esc(id)}</span>`); return; }
  S.node = id;
  for (const [k, v] of node) {
    if (S.over) return;
    if (k === 'music') { $('music').innerHTML = `♪ <strong>${esc(v)}</strong><br>${esc(MUSIC[v] || '')}<br>Bande-son originale à composer.`; }
    else if (k === 'set') S.flags.add(v);
    else if (k === 'health' || k === 'morale') gauge(k, +v);
    else if (k === 'line' && passes(v)) say(v);
  }
  if (S.over) return;
  if (get(node, 'end')) { gainXP(2); return endPanel('Fin de la scène', get(node, 'next') || S.scene.next); }
  renderChoices();
}

function renderChoices() {
  const ul = $('choices'); ul.innerHTML = '';
  if (!S || S.over || !S.node) return;
  const node = S.scene.nodes[S.node]; if (get(node, 'end')) return;
  let n = 0;
  getAll(node, 'choice').forEach((c, idx) => {
    if (!passes(c)) return;
    const key = S.scene.id + ':' + S.node + ':' + idx, check = get(c, 'check'), type = get(c, 'type');
    if (check && type === 'rouge' && S.tried.has(key)) return;
    const li = document.createElement('li'); const b = document.createElement('button');
    b.className = 'choice'; b.type = 'button'; n++;
    let label = '';
    if (check) {
      const d = +get(c, 'difficulty');
      const failedAt = S.failedWhite.get(key);
      if (failedAt !== undefined && S.skills[check] <= failedAt) {
        b.disabled = true; label = `<span class="chk">[${SKILL[check].name} · raté. Monte la compétence pour retenter]</span>`;
      } else {
        label = `<span class="chk ${type}">[${SKILL[check].name} · ${diffName(d)} ${d} · ${chance(S.skills[check], d)} %]</span>`;
      }
    }
    b.innerHTML = `<span class="n">${n}.</span><span>${label}${esc(get(c, 'text'))}</span>`;
    b.dataset.n = n;
    b.onclick = () => choose(c, key);
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(c, key) {
  $('choices').innerHTML = '';
  add(`<span class="who">Toi</span>${esc(get(c, 'text'))}`, 'you');
  const check = get(c, 'check');
  if (!check) return enter(get(c, 'goto'));
  const d = +get(c, 'difficulty'), lvl = S.skills[check], type = get(c, 'type');
  const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
  const ok = (a === 6 && b === 6) || (!(a === 1 && b === 1) && a + b + lvl >= d);
  const why = a === 6 && b === 6 ? ' (double six)' : a === 1 && b === 1 ? ' (double un)' : '';
  S.tried.add(key);
  if (type === 'blanc') { if (ok) S.failedWhite.delete(key); else S.failedWhite.set(key, lvl); }
  add(`Test ${type} de ${SKILL[check].name} : <span class="dice"><span class="die">${a}</span><span class="die">${b}</span></span> + ${lvl} = ${a + b + lvl} contre ${d}${why} → <b>${ok ? 'Réussite' : 'Échec'}</b>`, 'roll ' + (ok ? 'ok' : 'ko'));
  if (ok) gainXP(1);
  enter(get(c, ok ? 'success' : 'failure'));
}

function endPanel(title, next) {
  $('choices').innerHTML = '';
  const nextBtn = next && SCENES[next] ? `<button class="ghost" type="button" id="nextScene">Scène suivante : ${esc(SCENES[next].title)}</button>` : '';
  const more = next && !SCENES[next] ? `<span>La suite n'est pas encore écrite.</span>` : (!next && title !== 'Fin de partie' ? `<span>Fin du jeu.</span>` : '');
  add(`<div class="end"><b>${title}</b>${more}<span>Ce que le jeu retient : ${[...S.flags].filter(f => !f.startsWith('vu_')).map(esc).join(', ') || 'rien'}.</span><div class="toolbar">${nextBtn}<button class="ghost" type="button" id="replay">Rejouer avec un autre agent</button></div></div>`);
  if (nextBtn) $('nextScene').onclick = () => startScene(next);
  $('replay').onclick = showStart;
}

function spend(id) {
  if (!S || S.points <= 0) return;
  S.points--; S.skills[id]++;
  if (id === 'endurance') { S.maxH++; S.health++; }
  if (id === 'volonte') { S.maxM++; S.morale++; }
  renderDossier(); renderChoices();
}

function renderDossier() {
  const pips = (el, val, max, cls) => { el.innerHTML = Array.from({ length: max }, (_, i) => `<span class="pip ${cls} ${i < val ? 'on' : ''}"></span>`).join(''); };
  pips($('health'), S ? S.health : 0, S ? S.maxH : 0, 'h'); pips($('morale'), S ? S.morale : 0, S ? S.maxM : 0, 'm');
  const canSpend = S && S.points > 0 && !S.over;
  $('skills').innerHTML = ATTRS.map(a => `<div class="attr ${a.id}"><h3 style="color:var(--${a.id})">${a.name}</h3><ul>${a.skills.map(([id, name]) =>
    `<li><span>${name}</span><span class="lv">${S ? S.skills[id] : '–'}${canSpend ? `<button class="plus" type="button" data-skill="${id}" aria-label="Monter ${name}">+</button>` : ''}</span></li>`).join('')}</ul></div>`).join('');
  $('skills').querySelectorAll('.plus').forEach(b => b.onclick = () => spend(b.dataset.skill));
  $('xp').innerHTML = S ? `<span>Expérience ${S.xp} / ${XP_PER_POINT}${S.points ? ` · <span class="pts">${S.points} point${S.points > 1 ? 's' : ''} à dépenser</span>` : ''}</span><div class="xpbar"><i style="width:${S.xp / XP_PER_POINT * 100}%"></i></div>` : '';
}

function showStart() {
  S = null; renderDossier(); $('agentName').textContent = 'Commissaire sans écharpe';
  $('music').textContent = '♪ Aucune musique';
  $('choices').innerHTML = '';
  $('sceneTitle').textContent = `Prototype · ${ORDER.length} scènes`;
  $('log').innerHTML = `<div class="start entry">
    <p class="narr">Paris, 8 thermidor an II. La Terreur est à son comble, les charrettes roulent chaque jour vers l'échafaud. Dans la salle d'un comité de surveillance, un commissaire ouvre les yeux sur un plancher sale. Il ne sait plus qui il est.</p>
    <p>Choisis le commissaire que tu seras. Ses compétences décident de ce qu'il remarque, de ce que ses voix intérieures lui soufflent et de ses chances aux dés (2d6 + niveau). Chaque test réussi rapporte de l'expérience ; tous les ${XP_PER_POINT} points, tu montes une compétence, ce qui rouvre les tests blancs ratés.</p>
    <div class="archs">${ARCHETYPES.map((a, i) => `<button class="arch" type="button" data-i="${i}"><b>${a.name}</b><span>${a.desc}</span></button>`).join('')}</div>
    <p class="note">Prototype. Le texte vient des mêmes fichiers de dialogue que le jeu lira. Pas de son pour l'instant : la bande-son originale reste à composer.</p>
  </div>`;
  $('log').querySelectorAll('.arch').forEach(b => b.onclick = () => newGame(ARCHETYPES[+b.dataset.i]));
}

document.addEventListener('keydown', e => {
  if (!/^[1-9]$/.test(e.key) || e.target.tagName === 'INPUT') return;
  const b = $('choices').querySelector(`button[data-n="${e.key}"]`); if (b && !b.disabled) b.click();
});
$('restart').onclick = showStart;
showStart();
</script>
